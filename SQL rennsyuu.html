<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL 100問 練習アプリ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7fa;--card:#fff;--fg:#1c2733;--sub:#5d6b7a;--line:#d7dee6;--acc:#1f6feb;--ok:#1a7f37;--ng:#cf222e;--code:#0f1720;--codefg:#e6edf3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:#18212b;--fg:#e6edf3;--sub:#9aa7b4;--line:#2b3744;--acc:#58a6ff;--ok:#3fb950;--ng:#ff7b72}}
:root[data-theme="dark"]{--bg:#10161d;--card:#18212b;--fg:#e6edf3;--sub:#9aa7b4;--line:#2b3744;--acc:#58a6ff;--ok:#3fb950;--ng:#ff7b72}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
main{max-width:none;margin:0 auto;padding:16px 20px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.right{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.gh{font-size:20px;margin:0 0 10px}
@media (max-width:1199px) and (min-width:861px){.layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
@media (max-width:860px){.layout{grid-template-columns:1fr}.right{position:static;max-height:none}}
.dred{color:#cf222e;font-weight:bold;background:rgba(207,34,46,.12);border-radius:3px}
#diff{font:17px/1.6 Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-all;margin-bottom:10px}
.sw{font-size:14px;cursor:pointer;user-select:none}
.sw input{width:18px;height:18px;vertical-align:middle}
.layout.gclosed{grid-template-columns:minmax(0,1fr)}
.layout.gclosed .right{display:none}
#sugg{border:1px solid var(--line);border-radius:8px;background:var(--card);margin-top:4px;max-height:260px;overflow:auto}
.si{padding:6px 12px;cursor:pointer;font:16px Consolas,Menlo,monospace}
.si.on{background:var(--acc);color:#fff}
#sugg+.btns{margin-top:56px}
.si.on .sd{color:#fff}
.sd{color:var(--sub);font-size:14px;font-family:Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;margin-left:6px}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input{font:18px Arial,sans-serif;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:100%}
select{flex:1;min-width:200px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar div{height:100%;background:var(--ok);width:0}
.small{font-size:12px;color:var(--sub)}
.stage{color:var(--sub);font-size:16px}
.q{margin:8px 0;font-size:21px;line-height:1.6;font-weight:bold}
.hint{color:var(--sub);font-size:16px}
textarea{width:100%;min-height:220px;font:17px/1.6 Consolas,Menlo,monospace;background:var(--code);color:var(--codefg);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
button.b{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:10px 16px;font-size:16px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.t{border-radius:20px;padding:6px 14px;font-size:14px}
button.t.on{border-color:var(--acc);color:var(--acc);font-weight:bold}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.res{white-space:pre-wrap;font-size:16px;line-height:1.7}
.ok{color:var(--ok);font-weight:bold}.ng{color:var(--ng)}
pre{background:var(--code);color:var(--codefg);padding:10px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.wrap{overflow-x:auto}
code{font-family:Consolas,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<main>
<h1>SQL 100問 練習アプリ</h1>
<div class="row">

</div>
<p class="small" style="margin:6px 0">正解: <span id="cnt">0</span> / 300　<span id="stageCnt"></span></p>
<div class="bar"><div id="bar"></div></div>
<p class="small" id="logLine" style="margin:4px 0"></p>

<div class="layout" id="layoutMain"><div class="left">
<div class="row" style="margin-bottom:10px"><button class="b" id="gToggle">用語集を閉じる</button></div>
<section id="secQ">
  <div class="card">
    <div class="row">
      <button class="b" id="prev">◀ 前</button>
      <select id="sel"></select>
      <button class="b" id="next">次 ▶</button>
      <input id="goNum" type="number" min="1" max="300" placeholder="番号" style="width:110px"><button class="b" id="goBtn">移動</button>
      <label class="sw"><input type="checkbox" id="revOnTog"> <span>復習のみ</span></label>
      <span class="small" id="revCnt"></span>
    </div>
  </div>
  <div class="card">
    <div class="stage" id="stage"></div>
    <div class="small" id="judge" style="margin-top:4px"></div>
    <p class="q" id="q"></p>
    <p class="hint" id="hintTxt"></p>
  </div>
  <div class="card" id="ex" style="overflow-x:auto"></div>
<textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="ここにSQLを書く(記号は半角で)"></textarea>
<div id="sugg" style="display:none"></div>
  <div class="btns">
    <button class="b" id="run">RUN</button>
    <button class="b p" id="grade">採点する</button>
    <button class="b" id="hint">ヒント</button>
    <button class="b" id="fmt">整形</button>
    <button class="b" id="ans">解答例を見る</button>
    <button class="b" id="reset">リセット</button>
  </div>
  <div class="row" style="margin:6px 0"><label class="sw"><input type="checkbox" id="redTog" checked> <span id="redLbl">赤色表示: ON</span></label></div>
<div class="card" id="diff" style="display:none"></div>
<div class="card res" id="res">SQLを書いて「採点する」を押してください。入力は自動で保存されます。</div>
  <p class="small">※採点は、まず練習用データで実行した結果が答えと同じかで判定します。実行できない問題(簡易エンジン非対応の関数など)は、句の順番・列名・数字・日付で判定します。最終確認は DuckDB で行ってください。</p>
<div class="card">
  <b>進捗のバックアップ</b>
  <p class="small" style="margin:6px 0">「書き出す」で進捗を文字列にします。全文をコピーして保存しておくと、別のブラウザでも「読み込む」で元に戻せます。</p>
  <textarea id="bk" style="min-height:120px"></textarea>
  <div class="btns"><button class="b" id="bkOut">書き出す</button><button class="b" id="bkIn">読み込む</button></div>
  <div class="small" id="bkMsg"></div>
</div>
<div class="card" id="runOut" style="display:none;overflow-x:auto;margin-top:12px"></div>
</section>

</div>
<aside class="right">
  <div class="card">
    <h2 class="gh">用語集</h2>
    <input id="gsearch" placeholder="用語を検索" style="width:100%">
    <div class="wrap" style="margin-top:10px"><table id="gtable"></table></div>
  </div>
</aside>
</div>
</main>

<script>
var ST=[[1,"基本のSELECT"],[16,"WHERE(条件で絞る)"],[36,"並べ替えと件数"],[51,"集計とGROUP BY"],[71,"HAVING と CASE"],[81,"日付の扱い"],[91,"サブクエリ・ウィンドウ関数"],[101,"中級"],[201,"上級"]];
// [問題, ヒント, 解答例]
var D=[
["daily_retail_data の全列を表示してください。","SELECT と FROM だけで書けます。","SELECT * FROM daily_retail_data;"],
["transaction_date 列だけを表示してください。","列名を SELECT の後ろに書きます。","SELECT transaction_date FROM daily_retail_data;"],
["business_category と daily_revenue の2列を表示してください。","列はカンマで区切ります。","SELECT business_category, daily_revenue FROM daily_retail_data;"],
["industry_code 列だけを表示してください。","","SELECT industry_code FROM daily_retail_data;"],
["daily_revenue を5行だけ表示してください。","LIMIT で件数を決めます。","SELECT daily_revenue FROM daily_retail_data LIMIT 5;"],
["全列を10行だけ表示してください。","第1問の復習です。","SELECT * FROM daily_retail_data LIMIT 10;"],
["daily_revenue を revenue という別名で表示してください。","AS で別名を付けます。","SELECT daily_revenue AS revenue FROM daily_retail_data;"],
["transaction_date と、daily_revenue の1.1倍を revenue_with_tax という名前で表示してください。","計算式も SELECT に書けます。","SELECT transaction_date, daily_revenue * 1.1 AS revenue_with_tax FROM daily_retail_data;"],
["business_category の種類を重複なしで表示してください。","DISTINCT を使います。","SELECT DISTINCT business_category FROM daily_retail_data;"],
["transaction_date の日付の種類を重複なしで表示してください。","","SELECT DISTINCT transaction_date FROM daily_retail_data;"],
["industry_code の種類を重複なしで表示してください。","","SELECT DISTINCT industry_code FROM daily_retail_data;"],
["business_category と industry_code の組み合わせを重複なしで表示してください。","DISTINCT は複数列にも使えます。","SELECT DISTINCT business_category, industry_code FROM daily_retail_data;"],
["daily_revenue と、その2倍の値(double_revenue)を3行表示してください。","","SELECT daily_revenue, daily_revenue * 2 AS double_revenue FROM daily_retail_data LIMIT 3;"],
["transaction_date を20行表示してください。","","SELECT transaction_date FROM daily_retail_data LIMIT 20;"],
["business_category と transaction_date を10行表示してください。","","SELECT business_category, transaction_date FROM daily_retail_data LIMIT 10;"],
["daily_revenue が 1000 以上の行を全列表示してください。","比較演算子 >= を使います。","SELECT * FROM daily_retail_data WHERE daily_revenue >= 1000;"],
["daily_revenue が 1000 未満の行を、transaction_date と daily_revenue で表示してください。","","SELECT transaction_date, daily_revenue FROM daily_retail_data WHERE daily_revenue < 1000;"],
["daily_revenue が 0 の行を全列表示してください。","等しいは = です。","SELECT * FROM daily_retail_data WHERE daily_revenue = 0;"],
["daily_revenue が 0 ではない行を全列表示してください。","等しくないは <> です。","SELECT * FROM daily_retail_data WHERE daily_revenue <> 0;"],
["business_category が '食品' の行を全列表示してください。(業種名は実データの値に置き換えてOK)","文字列は半角のシングルクォートで囲みます。","SELECT * FROM daily_retail_data WHERE business_category = '食品';"],
["transaction_date が 2024-01-01 以降の行を、transaction_date と daily_revenue で表示してください。","日付は DATE '2024-01-01' と書けます。","SELECT transaction_date, daily_revenue FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01';"],
["2024年の行を全列表示してください。(2024-01-01 以上、2025-01-01 未満)","","SELECT * FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01';"],
["daily_revenue が 1000 以上 かつ 5000 未満の行を全列表示してください。","AND は両方を満たす行です。","SELECT * FROM daily_retail_data WHERE daily_revenue >= 1000 AND daily_revenue < 5000;"],
["daily_revenue が 100 未満 または 10000 以上の行を全列表示してください。","OR を使います。","SELECT * FROM daily_retail_data WHERE daily_revenue < 100 OR daily_revenue >= 10000;"],
["daily_revenue が 1000 以上 2000 以下の行を、BETWEEN を使って全列表示してください。","BETWEEN は両端を含みます。","SELECT * FROM daily_retail_data WHERE daily_revenue BETWEEN 1000 AND 2000;"],
["business_category が '食品' または '衣料' の行を全列表示してください。","IN を使うと短く書けます。","SELECT * FROM daily_retail_data WHERE business_category IN ('食品', '衣料');"],
["business_category が '食品' で始まる行を全列表示してください。","LIKE と % を使います。","SELECT * FROM daily_retail_data WHERE business_category LIKE '食品%';"],
["daily_revenue が NULL(空)ではない行を全列表示してください。","IS NOT NULL を使います。","SELECT * FROM daily_retail_data WHERE daily_revenue IS NOT NULL;"],
["daily_revenue が NULL(空)の行を全列表示してください。","IS NULL を使います。","SELECT * FROM daily_retail_data WHERE daily_revenue IS NULL;"],
["2024年3月の行を全列表示してください。","月初から翌月初の手前までを範囲で指定します。","SELECT * FROM daily_retail_data WHERE transaction_date >= DATE '2024-03-01' AND transaction_date < DATE '2024-04-01';"],
["2024年6月の transaction_date と daily_revenue を表示してください。","","SELECT transaction_date, daily_revenue FROM daily_retail_data WHERE transaction_date >= DATE '2024-06-01' AND transaction_date < DATE '2024-07-01';"],
["business_category が '食品' でない行を全列表示してください。","NOT を使います。","SELECT * FROM daily_retail_data WHERE NOT business_category = '食品';"],
["daily_revenue が 1000 以上 かつ business_category が '食品' の行を全列表示してください。","","SELECT * FROM daily_retail_data WHERE daily_revenue >= 1000 AND business_category = '食品';"],
["daily_revenue が 1000 以上の行を、5行だけ表示してください。","WHERE と LIMIT の組み合わせです。","SELECT * FROM daily_retail_data WHERE daily_revenue >= 1000 LIMIT 5;"],
["daily_revenue が 1000 以上の行を、daily_revenue の大きい順に全列表示してください。","","SELECT * FROM daily_retail_data WHERE daily_revenue >= 1000 ORDER BY daily_revenue DESC;"],
["daily_revenue の小さい順に、全列を5行表示してください。","ORDER BY の既定は昇順(ASC)です。","SELECT * FROM daily_retail_data ORDER BY daily_revenue LIMIT 5;"],
["daily_revenue の大きい順に、全列を5行表示してください。","","SELECT * FROM daily_retail_data ORDER BY daily_revenue DESC LIMIT 5;"],
["transaction_date の古い順に、全列を10行表示してください。","","SELECT * FROM daily_retail_data ORDER BY transaction_date ASC LIMIT 10;"],
["transaction_date の新しい順、同じ日付なら daily_revenue の大きい順に、全列を10行表示してください。","並べ替えの列はカンマで複数指定できます。","SELECT * FROM daily_retail_data ORDER BY transaction_date DESC, daily_revenue DESC LIMIT 10;"],
["business_category の名前順(昇順)に、business_category と daily_revenue を10行表示してください。","","SELECT business_category, daily_revenue FROM daily_retail_data ORDER BY business_category LIMIT 10;"],
["daily_revenue の大きい順に、6行目から5行を表示してください。(OFFSET を使う)","OFFSET 5 は先頭5行を飛ばします。","SELECT * FROM daily_retail_data ORDER BY daily_revenue DESC LIMIT 5 OFFSET 5;"],
["transaction_date の新しい順に、transaction_date と business_category を3行表示してください。","","SELECT transaction_date, business_category FROM daily_retail_data ORDER BY transaction_date DESC LIMIT 3;"],
["2024年の行を、daily_revenue の大きい順に10行表示してください。","WHERE → ORDER BY → LIMIT の順です。","SELECT * FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01' ORDER BY daily_revenue DESC LIMIT 10;"],
["daily_revenue が 0 の行を、transaction_date の古い順に全列表示してください。","","SELECT * FROM daily_retail_data WHERE daily_revenue = 0 ORDER BY transaction_date ASC;"],
["business_category の種類を、重複なしで名前順に表示してください。","DISTINCT と ORDER BY の組み合わせです。","SELECT DISTINCT business_category FROM daily_retail_data ORDER BY business_category;"],
["transaction_date の種類を、重複なしで新しい順に5件表示してください。","","SELECT DISTINCT transaction_date FROM daily_retail_data ORDER BY transaction_date DESC LIMIT 5;"],
["industry_code の種類を、重複なしで昇順に表示してください。","","SELECT DISTINCT industry_code FROM daily_retail_data ORDER BY industry_code;"],
["daily_revenue が 1000 以上の行を、次の順番に並べて、先頭5行を表示してください。①まず business_category の名前順(昇順)。②同じ業種の中では daily_revenue の大きい順(降順)。","","SELECT * FROM daily_retail_data WHERE daily_revenue >= 1000 ORDER BY business_category, daily_revenue DESC LIMIT 5;"],
["transaction_date が 2024-01-01 の行を全列表示してください。","日付リテラルで = を使います。","SELECT * FROM daily_retail_data WHERE transaction_date = DATE '2024-01-01';"],
["daily_revenue の大きい順に、全列を1行だけ表示してください。(最大値の行)","","SELECT * FROM daily_retail_data ORDER BY daily_revenue DESC LIMIT 1;"],
["行数を数えて、列名を total_rows として表示してください。","COUNT(*) を使います。","SELECT COUNT(*) AS total_rows FROM daily_retail_data;"],
["daily_revenue の合計を total_revenue という名前で表示してください。","","SELECT SUM(daily_revenue) AS total_revenue FROM daily_retail_data;"],
["daily_revenue の平均を avg_revenue という名前で表示してください。","","SELECT AVG(daily_revenue) AS avg_revenue FROM daily_retail_data;"],
["daily_revenue の最小値と最大値を、min_revenue と max_revenue という名前で表示してください。","","SELECT MIN(daily_revenue) AS min_revenue, MAX(daily_revenue) AS max_revenue FROM daily_retail_data;"],
["業種の種類数を、重複を除いて business_count という名前で表示してください。","COUNT(DISTINCT 列名) を使います。","SELECT COUNT(DISTINCT business_category) AS business_count FROM daily_retail_data;"],
["2024年の売上合計を year_total という名前で表示してください。","WHERE と SUM を組み合わせます。","SELECT SUM(daily_revenue) AS year_total FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01';"],
["業種ごとの行数を表示してください。(business_category と cnt)","GROUP BY で業種ごとにまとめます。","SELECT business_category, COUNT(*) AS cnt FROM daily_retail_data GROUP BY business_category;"],
["業種ごとの売上合計を表示してください。(business_category と total)","","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category;"],
["業種ごとの売上平均を avg_revenue という名前で表示してください。","","SELECT business_category, AVG(daily_revenue) AS avg_revenue FROM daily_retail_data GROUP BY business_category;"],
["業種ごとの売上合計を、合計の大きい順に表示してください。","GROUP BY → ORDER BY の順です。","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category ORDER BY total DESC;"],
["業種ごとの売上合計を、合計の大きい順に3件表示してください。","","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category ORDER BY total DESC LIMIT 3;"],
["日付ごとの売上合計を、日付の古い順に表示してください。(transaction_date と total)","","SELECT transaction_date, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY transaction_date ORDER BY transaction_date;"],
["業種ごと・日付ごとの売上合計を表示してください。(business_category、transaction_date、total)","GROUP BY は複数列にできます。","SELECT business_category, transaction_date, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category, transaction_date;"],
["業種コードごとの行数を表示してください。(industry_code と cnt)","","SELECT industry_code, COUNT(*) AS cnt FROM daily_retail_data GROUP BY industry_code;"],
["業種ごとの最大売上を max_revenue という名前で表示してください。","","SELECT business_category, MAX(daily_revenue) AS max_revenue FROM daily_retail_data GROUP BY business_category;"],
["業種ごとの売上の平均を、小数点以下0桁に四捨五入して avg_revenue で表示してください。","ROUND(値, 桁数) を使います。","SELECT business_category, ROUND(AVG(daily_revenue), 0) AS avg_revenue FROM daily_retail_data GROUP BY business_category;"],
["2024年の業種ごとの売上合計を、合計の大きい順に表示してください。","WHERE → GROUP BY → ORDER BY の順です。","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01' GROUP BY business_category ORDER BY total DESC;"],
["業種ごとの取引日数(重複なしの日付の数)を表示してください。(business_category と days)","","SELECT business_category, COUNT(DISTINCT transaction_date) AS days FROM daily_retail_data GROUP BY business_category;"],
["業種コードごとの売上合計と平均を表示してください。(total、avg_revenue)","","SELECT industry_code, SUM(daily_revenue) AS total, AVG(daily_revenue) AS avg_revenue FROM daily_retail_data GROUP BY industry_code;"],
["業種ごとの売上合計を求め、合計が最も大きい業種を1件だけ表示してください。","","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category ORDER BY total DESC LIMIT 1;"],
["売上合計が 100000 以上の業種だけを表示してください。(business_category と total)","集計結果の絞り込みは HAVING です。","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category HAVING SUM(daily_revenue) >= 100000;"],
["行数が 10 件より多い業種だけを表示してください。(business_category と cnt)","","SELECT business_category, COUNT(*) AS cnt FROM daily_retail_data GROUP BY business_category HAVING COUNT(*) > 10;"],
["平均売上が 1000 以上の業種を、平均の大きい順に表示してください。(avg_revenue)","HAVING と ORDER BY の併用です。","SELECT business_category, AVG(daily_revenue) AS avg_revenue FROM daily_retail_data GROUP BY business_category HAVING AVG(daily_revenue) >= 1000 ORDER BY avg_revenue DESC;"],
["2024年について、売上合計が 50000 以上の業種を表示してください。(WHERE と HAVING を両方使う)","","SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01' GROUP BY business_category HAVING SUM(daily_revenue) >= 50000;"],
["daily_revenue が 1000 以上の行だけを業種ごとに数え、件数が多い順に表示してください。(cnt)","","SELECT business_category, COUNT(*) AS cnt FROM daily_retail_data WHERE daily_revenue >= 1000 GROUP BY business_category ORDER BY cnt DESC;"],
["daily_revenue が 1000 以上なら '高'、そうでなければ '低' と表示してください。(daily_revenue と level)","CASE WHEN ... THEN ... ELSE ... END","SELECT daily_revenue, CASE WHEN daily_revenue >= 1000 THEN '高' ELSE '低' END AS level FROM daily_retail_data;"],
["daily_revenue を 1000未満 '小'、1000以上5000未満 '中'、5000以上 '大' の3段階で表示してください。(level)","CASE は上から順に判定されます。","SELECT daily_revenue, CASE WHEN daily_revenue < 1000 THEN '小' WHEN daily_revenue < 5000 THEN '中' ELSE '大' END AS level FROM daily_retail_data;"],
["業種ごとに、daily_revenue が 1000 以上の行数(high_cnt)を表示してください。","CASE を SUM の中に入れると、条件付きの件数が数えられます。","SELECT business_category, SUM(CASE WHEN daily_revenue >= 1000 THEN 1 ELSE 0 END) AS high_cnt FROM daily_retail_data GROUP BY business_category;"],
["daily_revenue が NULL の場合は 0 として、revenue という名前で表示してください。","COALESCE(列, 代わりの値)","SELECT COALESCE(daily_revenue, 0) AS revenue FROM daily_retail_data;"],
["daily_revenue を整数型(INTEGER)に変換して、revenue_int という名前で表示してください。","CAST(列 AS 型)","SELECT CAST(daily_revenue AS INTEGER) AS revenue_int FROM daily_retail_data;"],
["transaction_date を '2024-03' の形の年月文字列にして、重複なしで古い順に表示してください。(ym)","STRFTIME(日付, '%Y-%m')","SELECT DISTINCT STRFTIME(transaction_date, '%Y-%m') AS ym FROM daily_retail_data ORDER BY ym;"],
["transaction_date の年だけを取り出して、重複なしで表示してください。(yr)","EXTRACT(year FROM 日付)","SELECT DISTINCT EXTRACT(year FROM transaction_date) AS yr FROM daily_retail_data;"],
["transaction_date を月初日に切り捨てて、重複なしで表示してください。(month_start)","DATE_TRUNC('month', 列)","SELECT DISTINCT DATE_TRUNC('month', transaction_date) AS month_start FROM daily_retail_data;"],
["月ごとの売上合計を、月の古い順に表示してください。(sales_month と total)","SELECT と GROUP BY に同じ式を書きます。","SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date) ORDER BY sales_month;"],
["年ごとの売上合計を表示してください。(yr と total、STRFTIME で年を取り出す)","","SELECT STRFTIME(transaction_date, '%Y') AS yr, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY STRFTIME(transaction_date, '%Y') ORDER BY yr;"],
["月ごとの取引日数(重複なしの日付数)を表示してください。(sales_month と days)","","SELECT DATE_TRUNC('month', transaction_date) AS sales_month, COUNT(DISTINCT transaction_date) AS days FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date) ORDER BY sales_month;"],
["2024年の月ごとの売上合計を、月の古い順に表示してください。","WHERE で年を絞ってから集計します。","SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01' GROUP BY DATE_TRUNC('month', transaction_date) ORDER BY sales_month;"],
["月ごとの売上合計を '2024-03' の形式で、古い順に表示してください。(month と total)","","SELECT STRFTIME(DATE_TRUNC('month', transaction_date), '%Y-%m') AS month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY STRFTIME(DATE_TRUNC('month', transaction_date), '%Y-%m') ORDER BY month;"],
["月ごとの1日あたりの平均売上を計算してください。(売上合計 ÷ 取引日数。sales_month と avg_daily)","SUM と COUNT(DISTINCT) を使います。","SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) / COUNT(DISTINCT transaction_date) AS avg_daily FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date) ORDER BY sales_month;"],
["2024年で、行数が 100 行以上の月だけを表示してください。(sales_month と cnt)","WHERE → GROUP BY → HAVING の順です。","SELECT DATE_TRUNC('month', transaction_date) AS sales_month, COUNT(*) AS cnt FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01' GROUP BY DATE_TRUNC('month', transaction_date) HAVING COUNT(*) >= 100 ORDER BY sales_month;"],
["daily_revenue が全体の平均より大きい行を全列表示してください。(サブクエリを使う)","WHERE の中に SELECT を入れられます。","SELECT * FROM daily_retail_data WHERE daily_revenue > (SELECT AVG(daily_revenue) FROM daily_retail_data);"],
["業種ごとの平均売上が、全体の平均売上より大きい業種を、business_category と avg_revenue で表示してください。","HAVING の中にもサブクエリを書けます。","SELECT business_category, AVG(daily_revenue) AS avg_revenue FROM daily_retail_data GROUP BY business_category HAVING AVG(daily_revenue) > (SELECT AVG(daily_revenue) FROM daily_retail_data);"],
["WITH を使って業種ごとの売上合計(total)を作り、合計が 100000 以上の業種を表示してください。","WITH 名前 AS (...) SELECT ... の形です。","WITH totals AS (SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category) SELECT business_category, total FROM totals WHERE total >= 100000;"],
["月ごとの売上合計と、前月からの差額(diff)を表示してください。(sales_month、total、diff)","LAG(列) OVER (ORDER BY 列) で前の行の値を取れます。月次集計は WITH で作ると書きやすいです。","WITH monthly AS (SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date)) SELECT sales_month, total, total - LAG(total) OVER (ORDER BY sales_month) AS diff FROM monthly ORDER BY sales_month;"],
["業種ごとの売上合計に、売上の大きい順の順位(rank_no)を付けてください。(business_category、total、rank_no)","RANK() OVER (ORDER BY 列 DESC)","WITH totals AS (SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category) SELECT business_category, total, RANK() OVER (ORDER BY total DESC) AS rank_no FROM totals;"],
["日付の古い順に、売上の累計(running_total)を表示してください。(transaction_date、daily_revenue、running_total)","SUM(列) OVER (ORDER BY 列)","SELECT transaction_date, daily_revenue, SUM(daily_revenue) OVER (ORDER BY transaction_date) AS running_total FROM daily_retail_data ORDER BY transaction_date;"],
["業種ごとに、daily_revenue が大きい順の番号(row_no)を付けてください。(business_category、daily_revenue、row_no)","ROW_NUMBER() OVER (PARTITION BY 列 ORDER BY 列 DESC)","SELECT business_category, daily_revenue, ROW_NUMBER() OVER (PARTITION BY business_category ORDER BY daily_revenue DESC) AS row_no FROM daily_retail_data;"],
["業種ごとに daily_revenue が最大の1行を表示してください。(business_category、transaction_date、daily_revenue)","ウィンドウ関数の結果は WITH で作ってから絞ると書けます。","WITH ranked AS (SELECT business_category, transaction_date, daily_revenue, ROW_NUMBER() OVER (PARTITION BY business_category ORDER BY daily_revenue DESC) AS row_no FROM daily_retail_data) SELECT business_category, transaction_date, daily_revenue FROM ranked WHERE row_no = 1;"],
["月ごとの売上合計を求め、前月比の増減率(%)を表示してください。(sales_month、total、mom_pct。最初の月は NULL でOK)","これまでの総仕上げです。100.0 * (今月 - 前月) / 前月 で計算します。","WITH monthly AS (SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date)) SELECT sales_month, total, ROUND(100.0 * (total - LAG(total) OVER (ORDER BY sales_month)) / NULLIF(LAG(total) OVER (ORDER BY sales_month), 0), 2) AS mom_pct FROM monthly ORDER BY sales_month;"],
["daily_revenue が 0 より大きい行を、transaction_date の古い順に3行表示してください。(全列)","WHERE で条件を書き、ORDER BY と LIMIT を続けます。","SELECT * FROM daily_retail_data WHERE daily_revenue > 0 ORDER BY transaction_date LIMIT 3;"],
["業種ごとの売上合計と、全体に占める割合(%)を表示してください。割合の大きい順に並べます。(business_category、total、share_pct)","分母は、サブクエリで全体の合計を求めます。","SELECT business_category, SUM(daily_revenue) AS total, ROUND(100.0 * SUM(daily_revenue) / (SELECT SUM(daily_revenue) FROM daily_retail_data), 2) AS share_pct FROM daily_retail_data GROUP BY business_category ORDER BY share_pct DESC;"],
["月ごとの売上合計が、全期間の月平均より大きい月だけを表示してください。(sales_month、total)","月次集計を WITH で作り、WHERE でサブクエリの平均と比べます。","WITH monthly AS (SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date)) SELECT sales_month, total FROM monthly WHERE total > (SELECT AVG(total) FROM monthly) ORDER BY sales_month;"],
["業種ごとの1日あたりの平均売上が最も高い業種を1件表示してください。(business_category、avg_daily)","","SELECT business_category, AVG(daily_revenue) AS avg_daily FROM daily_retail_data GROUP BY business_category ORDER BY avg_daily DESC LIMIT 1;"],
["日付ごとの売上合計を求め、売上が多い上位5日を表示してください。(transaction_date、total)","","SELECT transaction_date, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY transaction_date ORDER BY total DESC LIMIT 5;"],
["業種ごと・月ごとの売上合計を表示してください。並び順は、業種名の順、同じ業種なら月の古い順です。(business_category、sales_month、total)","GROUP BY に2つの列(または式)を書きます。","SELECT business_category, DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category, DATE_TRUNC('month', transaction_date) ORDER BY business_category, sales_month;"],
["売上が NULL の行は 0 として扱い、業種ごとの合計を表示してください。(business_category、total)","COALESCE(列, 0) を SUM の中に入れます。","SELECT business_category, SUM(COALESCE(daily_revenue, 0)) AS total FROM daily_retail_data GROUP BY business_category;"],
["業種ごとに、売上が 1000 以上だった日数と、取引があった日数の合計を表示してください。(business_category、high_days、all_days)","CASE で条件に合う日付だけを数えます。","SELECT business_category, COUNT(DISTINCT CASE WHEN daily_revenue >= 1000 THEN transaction_date END) AS high_days, COUNT(DISTINCT transaction_date) AS all_days FROM daily_retail_data GROUP BY business_category;"],
["業種が4種類すべてある日だけを表示してください。(transaction_date、categories)","HAVING で、業種数(重複なし)が 4 の日を絞ります。","SELECT transaction_date, COUNT(DISTINCT business_category) AS categories FROM daily_retail_data GROUP BY transaction_date HAVING COUNT(DISTINCT business_category) = 4 ORDER BY transaction_date;"],
["業種ごとに、最も新しい取引日の行だけを表示してください。(business_category、transaction_date、daily_revenue)","ROW_NUMBER() で、業種ごとに日付の降順の番号を付けます。","WITH ranked AS (SELECT business_category, transaction_date, daily_revenue, ROW_NUMBER() OVER (PARTITION BY business_category ORDER BY transaction_date DESC) AS rn FROM daily_retail_data) SELECT business_category, transaction_date, daily_revenue FROM ranked WHERE rn = 1;"],
["業種ごとに、前の取引日からの売上の増減(差)を表示してください。(business_category、transaction_date、diff)","LAG を PARTITION BY 付きで使います。","SELECT business_category, transaction_date, daily_revenue - LAG(daily_revenue) OVER (PARTITION BY business_category ORDER BY transaction_date) AS diff FROM daily_retail_data ORDER BY business_category, transaction_date;"],
["月ごとの売上合計と、当月を含む3か月移動平均を表示してください。(sales_month、total、moving_avg3)","ROWS BETWEEN 2 PRECEDING AND CURRENT ROW を使います。","WITH monthly AS (SELECT DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date)) SELECT sales_month, total, AVG(total) OVER (ORDER BY sales_month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS moving_avg3 FROM monthly ORDER BY sales_month;"],
["業種ごとの売上の累計を、日付の古い順に表示してください。(business_category、transaction_date、running_total)","SUM(...) OVER (PARTITION BY ... ORDER BY ...) を使います。","SELECT business_category, transaction_date, SUM(daily_revenue) OVER (PARTITION BY business_category ORDER BY transaction_date) AS running_total FROM daily_retail_data ORDER BY business_category, transaction_date;"],
["2024年の業種ごとの売上合計と、売上順位(1位が最大)を表示してください。(business_category、total、rank_no)","WITH で合計を作ってから RANK() を付けます。","WITH totals AS (SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data WHERE transaction_date >= DATE '2024-01-01' AND transaction_date < DATE '2025-01-01' GROUP BY business_category) SELECT business_category, total, RANK() OVER (ORDER BY total DESC) AS rank_no FROM totals ORDER BY rank_no;"],
["業種ごとに、月別の売上が最も多かった月を1行ずつ表示してください。(business_category、sales_month、total)","2段階の WITH で、月次集計 → 業種内の順位の順に作ります。","WITH monthly AS (SELECT business_category, DATE_TRUNC('month', transaction_date) AS sales_month, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category, DATE_TRUNC('month', transaction_date)), ranked AS (SELECT business_category, sales_month, total, ROW_NUMBER() OVER (PARTITION BY business_category ORDER BY total DESC) AS rn FROM monthly) SELECT business_category, sales_month, total FROM ranked WHERE rn = 1 ORDER BY business_category;"],
["売上が全体の平均より大きい行の件数を、業種ごとに表示してください。(business_category、above_cnt)","WHERE にサブクエリを書きます。","SELECT business_category, COUNT(*) AS above_cnt FROM daily_retail_data WHERE daily_revenue > (SELECT AVG(daily_revenue) FROM daily_retail_data) GROUP BY business_category;"],
["業種ごとの最初の取引日を表示してください。(business_category、first_date)","","SELECT business_category, MIN(transaction_date) AS first_date FROM daily_retail_data GROUP BY business_category ORDER BY business_category;"],
["月ごとに、取引のあった業種数(重複なし)と売上合計を表示してください。(sales_month、categories、total)","","SELECT DATE_TRUNC('month', transaction_date) AS sales_month, COUNT(DISTINCT business_category) AS categories, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY DATE_TRUNC('month', transaction_date) ORDER BY sales_month;"],
["業種ごとの売上合計を、業種コードの順に並べ、同じ業種コードの中では合計の多い順に表示してください。(industry_code、business_category、total)","","SELECT industry_code, business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY industry_code, business_category ORDER BY industry_code, total DESC;"],
["業種ごとに、売上の上位3件の合計を表示してください。(business_category、top3_total)","ROW_NUMBER() で業種ごとの順位を付けてから、3位まで合計します。","WITH ranked AS (SELECT business_category, daily_revenue, ROW_NUMBER() OVER (PARTITION BY business_category ORDER BY daily_revenue DESC) AS rn FROM daily_retail_data) SELECT business_category, SUM(daily_revenue) AS top3_total FROM ranked WHERE rn <= 3 GROUP BY business_category ORDER BY business_category;"],
["業種ごとに、売上が 1000 以上の行の割合(%)を表示してください。(business_category、ratio_pct)","割合は 100.0 * 件数 / 全件数 です。CASE で1と0に変換して合計すると書けます。","SELECT business_category, ROUND(100.0 * SUM(CASE WHEN daily_revenue >= 1000 THEN 1 ELSE 0 END) / COUNT(*), 2) AS ratio_pct FROM daily_retail_data GROUP BY business_category ORDER BY business_category;"]
];

function sameResult(a,b,ordered){

  var A=norm(a),B=norm(b);

  if(ordered)return JSON.stringify(A)===JSON.stringify(B);

        case "UPPER":return av[0]==null?null:String(av[0]).toUpperCase();
        case "LOWER":return av[0]==null?null:String(av[0]).toLowerCase();
        case "LENGTH":return av[0]==null?null:String(av[0]).length;
        case "DATE_TRUNC":{
          var part=String(av[0]).toLowerCase(),d=av[1];if(d==null)return null;
          if(part==="month")return d.slice(0,7)+"-01";
          if(part==="year")return d.slice(0,4)+"-01-01";
          if(part==="day")return d.slice(0,10);
          throw uns("DATE_TRUNC の単位 "+part);
        }
        case "STRFTIME":{
          var sd=av[0],fmt=String(av[1]);if(sd==null)return null;
          return fmt.replace(/%(.)/g,function(_,ch){
            if(ch==="Y")return sd.slice(0,4);
            if(ch==="m")return sd.slice(5,7);
            if(ch==="d")return sd.slice(8,10);
            if(ch==="%")return "%";
            throw uns("STRFTIME の書式 %"+ch);
          });
        }
      }
      throw uns("関数 "+e.f);
    }
    case "AGG":{
      if(!G)throw new Error("集計関数は SELECT・HAVING・ORDER BY で使ってください");
      if(e.f==="COUNTALL")return G.rows.length;
      var vals=G.rows.map(function(r){return ev(e.a,r,null)}).filter(function(v){return v!=null});
      return aggregateVals(e.f,vals,e.distinct);
    }
  }
  throw uns("式 "+e.op);
}

function computeWin(w,rows){
  var out=new Array(rows.length);
  var groups={},gorder=[];
  rows.forEach(function(r,i){
    var gk=JSON.stringify(w.part.map(function(p){return ev(p,r,null)}));
    if(!groups[gk]){groups[gk]=[];gorder.push(gk)}
    groups[gk].push(i);
  });
  gorder.forEach(function(gk){
    var idx=groups[gk],m=idx.length;
    var ok=idx.map(function(i){return w.ord.map(function(o){return ev(o.e,rows[i],null)})});
    var pos=[];for(var j=0;j<m;j++)pos.push(j);
    pos.sort(function(a,b){
      for(var t=0;t<w.ord.length;t++){
        var x=ok[a][t],y=ok[b][t];
        if(x==null&&y==null)continue;
        if(x==null)return 1;if(y==null)return -1;
        var c=cmpVal(x,y);if(c)return w.ord[t].desc?-c:c;
      }
      return a-b;
    });
    var sorted=pos.map(function(p){return idx[p]});
    var sk=pos.map(function(p){return ok[p]});
    var same=function(a,b){
      for(var t=0;t<w.ord.length;t++){var x=a[t],y=b[t];if(x==null&&y==null)continue;if(x==null||y==null||x!==y)return false}
      return true;
    };
    var pStart=[],pEnd=[],dense=[];
    for(j=0;j<m;j++){
      if(j>0&&same(sk[j],sk[j-1])){pStart[j]=pStart[j-1];dense[j]=dense[j-1]}
      else{pStart[j]=j;dense[j]=(j>0?dense[j-1]:0)+1}
    }
    for(j=m-1;j>=0;j--){pEnd[j]=(j<m-1&&same(sk[j],sk[j+1]))?pEnd[j+1]:j}
    var f=w.f;
    for(j=0;j<m;j++){
      var row=rows[sorted[j]],val;
      if(f==="ROW_NUMBER")val=j+1;
      else if(f==="RANK")val=pStart[j]+1;
      else if(f==="DENSE_RANK")val=dense[j];
      else if(f==="PERCENT_RANK")val=m<=1?0:pStart[j]/(m-1);
      else if(f==="NTILE")val=ntile(j,m,ev(w.args[0],row,null));
      else if(f==="LAG"||f==="LEAD"){
        var off=w.args.length>1?ev(w.args[1],row,null):1;
        var dflt=w.args.length>2?ev(w.args[2],row,null):null;
        var t2=f==="LAG"?j-off:j+off;
        val=(t2>=0&&t2<m)?ev(w.args[0],rows[sorted[t2]],null):dflt;
      }
      else if(f==="FIRST_VALUE"){
        var fs=w.frame?(w.frame.n===null?0:Math.max(0,j-w.frame.n)):0;
        val=ev(w.args[0],rows[sorted[fs]],null);
      }
      else{
        var st=0,en=m-1;
        if(w.frame){st=w.frame.n===null?0:Math.max(0,j-w.frame.n);en=j}
        else if(w.ord.length){st=0;en=pEnd[j]}
        var vals=[];
        for(var q2=st;q2<=en;q2++){
          if(w.star)vals.push(1);
          else{var vv=ev(w.args[0],rows[sorted[q2]],null);if(vv!=null)vals.push(vv)}
        }
        val=aggregateVals(f,vals,w.distinct);
      }
      out[sorted[j]]=val;
    }
  });
  return out;
}

function runQ(q,env){
  var src;
  if(q.from.sub)src=runQuery(q.from.sub,env);
  else{
    var nm=q.from.name;
    if(!Object.prototype.hasOwnProperty.call(env,nm))throw syn("テーブル「"+nm+"」が見つかりません(使えるのは "+TABLE+" と WITH で作った名前です)");
    src=env[nm];
  }
  var names=src.names;
  var rows=src.rows.map(function(r){return Object.assign({},r)});
  var items=[];
  q.items.forEach(function(it){
    if(it.star)names.forEach(function(c){items.push({e:{op:"COL",name:c},name:c})});
    else items.push({e:it.e,name:it.alias||(it.e.op==="COL"?it.e.name:null)});
  });
  items.forEach(function(it,i){if(!it.name)it.name="col"+(i+1)});
  var seen={};
  items.forEach(function(it){if(seen[it.name]){it.name=it.name+"_"+seen[it.name]++}else seen[it.name]=1});
  var orders=q.order.map(function(o){
    var e=o.e;
    if(e.op==="LIT"&&typeof e.v==="number"&&e.v%1===0){
      if(e.v<1||e.v>items.length)throw new Error("ORDER BY の番号が範囲外です: "+e.v);
      return {pos:e.v-1,desc:o.desc};
    }
    if(e.op==="COL"&&names.indexOf(e.name)<0){
      var idx=-1;items.forEach(function(it,j){if(it.name===e.name&&idx<0)idx=j});
      if(idx<0)throw new Error("列が見つかりません: "+e.name);
      return {pos:idx,desc:o.desc};
    }
    return {e:e,desc:o.desc};
  });
  items.forEach(function(it){checkCols(it.e,names)});
  if(q.where){checkCols(q.where,names);if(hasAgg(q.where))throw new Error("WHERE では集計関数は使えません");if(hasWin(q.where))throw new Error("WHERE ではウィンドウ関数は使えません")}
  q.group.forEach(function(g){checkCols(g,names)});
  if(q.having)checkCols(q.having,names);
  orders.forEach(function(o){if(o.e)checkCols(o.e,names)});
  var isAgg=q.group.length>0||q.having!==null||items.some(function(it){return hasAgg(it.e)})||orders.some(function(o){return o.e&&hasAgg(o.e)});
  var allE=items.map(function(it){return it.e}).concat(orders.filter(function(o){return o.e}).map(function(o){return o.e}));
  var hasW=allE.some(hasWin);
  if(hasW&&isAgg)throw uns("集計と同時に使うウィンドウ関数");
  var src2=rows.filter(function(r){return !q.where||ev(q.where,r,null)===true});
  if(hasW){
    var wins=[];allE.forEach(function(e){collectWins(e,wins)});
    src2.forEach(function(r){r.__w={}});
    var done={};
    wins.forEach(function(w){
      var kk=key(w);if(done[kk])return;done[kk]=1;
      var vals=computeWin(w,src2);
      src2.forEach(function(r,i){r.__w[kk]=vals[i]});
    });
  }
  var recs=[];
  if(!isAgg){
    src2.forEach(function(r){recs.push({out:items.map(function(it){return ev(it.e,r,null)}),row:r})});
  }else{
    var groups=[];
    if(q.group.length){
      var map={};
      src2.forEach(function(r){
        var gk=JSON.stringify(q.group.map(function(g){return ev(g,r,null)}));
        if(!map[gk]){map[gk]=[];groups.push(map[gk])}
        map[gk].push(r);
      });
    }else groups.push(src2);
    var keys={};q.group.forEach(function(g){keys[key(g)]=1});
    groups.forEach(function(grows){
      var G={rows:grows,keys:keys};
      if(q.having&&ev(q.having,null,G)!==true)return;
      recs.push({out:items.map(function(it){return ev(it.e,null,G)}),G:G});
    });
  }
  if(q.distinct){
    var sd={};
    recs=recs.filter(function(rc){var k3=JSON.stringify(rc.out);if(sd[k3])return false;sd[k3]=1;return true});
  }
  recs.forEach(function(rc,idx){
    rc.idx=idx;
    rc.sk=orders.map(function(o){
      if(o.pos!==undefined)return rc.out[o.pos];
      return rc.G?ev(o.e,null,rc.G):ev(o.e,rc.row,null);
    });
  });
  if(orders.length){
    recs.sort(function(a,b){
      for(var j=0;j<orders.length;j++){
        var x=a.sk[j],y=b.sk[j];
        if(x==null&&y==null)continue;
        if(x==null)return 1;
        if(y==null)return -1;
        var c=cmpVal(x,y);
        if(c)return orders[j].desc?-c:c;
      }
      return a.idx-b.idx;
    });
  }
  var end=q.limit===null?undefined:q.offset+q.limit;
  recs=recs.slice(q.offset,end);
  var outNames=items.map(function(it){return it.name});
  return {names:outNames,rows:recs.map(function(rc){var o={};items.forEach(function(it,j){o[it.name]=rc.out[j]});return o})};
}
function runQuery(q,env){
  var prev=CUR;CUR=env;
  try{return runQ(q,env)}finally{CUR=prev}
}
function run(sql,table){
  var pq=parseQuery(sql);
  var env={};
  env[TABLE]={names:COLS.slice(),rows:table};
  pq.ctes.forEach(function(c){env[c.name]=runQuery(c.q,env)});
  return runQuery(pq.main,env).rows;
}
return {run:run,COLS:COLS};
})();


function freshTable(){}
function setupDB(){}
function runOn(sql){
  return MiniSQL.run(sql.replace(/;\s*$/,""),SAMPLE);
}
function runSQL(){
  var raw=$("sql").value,box=$("runOut");
  box.style.display="";
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
  if(!raw.trim()){box.innerHTML="SQLが空です。";return}
  try{
    box.innerHTML=renderTable(runOn(raw));
  }catch(e){
    box.innerHTML=e.unsupported
      ?'<span class="ng">未対応の書き方です</span><br><span class="small">'+esc(e.message)+'</span>'
      :'<span class="ng">エラー: '+esc(e.message||String(e))+'</span>';
  }
}

var hintLv={};
function pad2(n){return (n<10?"0":"")+n}
function todayKey(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function stageCounts(){
  var names=["初心者","中級","上級"],out=[];
  names.forEach(function(nm,k){var n=0;for(var i=k*100;i<k*100+100;i++){if(S[i]&&S[i].ok)n++}out.push(nm+" "+n+"/100")});
  $("stageCnt").textContent=out.join("　");
}
function logLine(){
  var L=S.__log||{},t=L[todayKey()]||0;
  var days=Object.keys(L).sort().slice(-7).map(function(d){return d.slice(5)+": "+L[d]+"問"}).join("　");
  $("logLine").textContent="今日の正解: "+t+"問"+(days?"　／　最近の記録　"+days:"");
}
function updCount(){
  var n=0;for(var k in S){if(S[k]&&S[k].ok)n++}
  ok=n;$("cnt").textContent=n;$("bar").style.width=(n/3)+"%";
  stageCounts();logLine();
}
function judgeText(i){
  try{runOn(D[i][2]);return "判定: 結果で採点(練習用データの結果が同じなら正解)"}
  catch(e){return e.unsupported?"判定: 書き方で採点(このエンジンでは未対応の書き方のため)":"判定: 書き方で採点"}
}
var __show=show;
show=function(i){__show(i);hintLv[cur]=0;$("judge").textContent=judgeText(cur)};
var __grade2=$("grade").onclick;
$("grade").onclick=function(e){
  __grade2.call(this,e);
  if(S[cur]&&S[cur].ok&&!S[cur].counted){
    S[cur].counted=true;
    S.__log=S.__log||{};var tk=todayKey();S.__log[tk]=(S.__log[tk]||0)+1;
    save();
  }
  updCount();
};
$("hint").onclick=function(){
  var lv=Math.min((hintLv[cur]||0)+1,3);hintLv[cur]=lv;
  var q=D[cur];
  if(lv===1){$("res").textContent="ヒント1: "+(q[1]||"特になし。問題文の条件を一つずつ確かめてみてください。")}
  else if(lv===2){
    var cl=(q[2].match(/\b(SELECT|FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|WITH|OVER)\b/g)||[]).filter(function(x,k,a){return a.indexOf(x)===k});
    $("res").textContent="ヒント2: 使う句は "+cl.join("、")+" です。順番に書いてみてください。"
  }
  else{$("res").innerHTML="ヒント3(解答例):<pre>"+esc(q[2])+"</pre>"}
};
function formatSQL(s){
  var parts=s.split(/('[^']*')/);
  for(var i=0;i<parts.length;i+=2){
    parts[i]=parts[i].replace(/\s+/g," ").replace(/\b(select|distinct|from|where|group by|having|order by|limit|offset|and|or|not|in|is|null|between|like|case|when|then|else|end|as|desc|asc|cast|date|with|over|partition by|rows|between)\b/gi,function(w){return w.toUpperCase()});
  }
  var t=parts.join("");
  t=t.replace(/\s*\b(FROM|WHERE|GROUP BY|HAVING|ORDER BY|LIMIT|OFFSET)\b\s*/g,function(m,k){return "\n"+k+" "});
  return t.replace(/\s+\n/g,"\n").replace(/\n\s+/g,"\n").trim();
}
$("fmt").onclick=function(){
  var v=formatSQL($("sql").value);
  $("sql").value=v;S[cur]=S[cur]||{};S[cur].sql=v;save();
};
$("goBtn").onclick=function(){
  var n=parseInt($("goNum").value,10);
  if(!n||n<1||n>D.length){$("goNum").value="";return}
  if(revOn&&!(S[n-1]&&S[n-1].miss&&!S[n-1].ok)){revOn=false;$("revOnTog").checked=false}
  show(n-1);fillSel();
};
var gOpen=true;
$("gToggle").onclick=function(){gOpen=!gOpen;$("layoutMain").classList.toggle("gclosed",!gOpen);this.textContent=gOpen?"用語集を閉じる":"用語集を開く"};
show(0);
