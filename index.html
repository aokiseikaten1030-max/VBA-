<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VBA 単語集(使い方・サンプル付き)</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--fg:#1c2733;--sub:#5d6b7a;--line:#d7dee6}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
main{max-width:1000px;margin:0 auto;padding:18px}
h1{font-size:26px;margin:6px 0 12px;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
input#q{width:100%;font:18px Arial,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
#cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.subcats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed #d7dee6}
.subcats button.cat{width:100%;font-size:15px;padding:5px 10px}
#cats button.cat{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){#cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
button.cat{font:16px Arial,sans-serif;border:2px solid #b9c4d0;background:#ffffff;color:#1c2733;border-radius:20px;padding:6px 14px;cursor:pointer}
button.cat:hover{border-color:#1a7f37}
button.cat.on{background:#1a7f37;border-color:#1a7f37;color:#ffffff;font-weight:bold}
.count{color:var(--sub);font-size:15px;margin-top:10px}
.empty{text-align:center;color:var(--sub);padding:30px}
.gg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.gg-card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;padding:12px 14px;border-top:6px solid var(--c);cursor:pointer;transition:transform .1s,box-shadow .1s}
.gg-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.gg-card.sel{outline:3px solid var(--c)}
.gg-name{font:bold 20px Consolas,Menlo,monospace;color:var(--c);word-break:break-all}
.gg-mean{font-size:14px;margin-top:4px}
.gg-tag{font-size:12px;color:#5d6b7a;margin-top:8px}
.dt-wrap{background:#fff;border:1px solid #d7dee6;border-radius:12px;padding:16px;margin-bottom:14px}
.dt-title{font-size:20px;font-weight:bold;margin:0 0 4px}
.dt-lead{color:#5d6b7a;font-size:14px;margin:0 0 12px}
.dt-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.dt-chip{font-size:13px;padding:3px 10px;border-radius:12px;color:#fff;font-weight:bold}
.dt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dt-card{background:#fff;border:1px solid #e1e7ef;border-radius:12px;padding:12px 14px;border-top:6px solid var(--c);box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;transition:transform .1s,box-shadow .1s}
.dt-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.dt-card.sel{outline:3px solid var(--c)}
.dt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.dt-name{font:bold 22px Consolas,Menlo,monospace;color:var(--c)}
.dt-jp{color:#5d6b7a;font-size:13px}
.dt-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#fff4d6;color:#8a5a00;border:1px solid #f1d58a;white-space:nowrap}
.dt-range{margin:8px 0 6px;padding:7px 9px;background:#f7f9fc;border-radius:8px;font-size:14px}
.dt-use{font-size:14px}
.dt-use b{color:var(--c)}
.dt-note{margin-top:12px;font-size:14px;color:#5d6b7a}
.dt-detail{grid-column:1 / -1;border:2px solid #e1e7ef;border-radius:12px;padding:14px 16px;background:#fbfcfe;margin:4px 0 8px}
.dt-det-title{font:bold 24px Consolas,Menlo,monospace;margin-bottom:6px}
.dt-jp.inline{font-size:15px}
.dt-det-row{margin:6px 0;font-size:15px}
.dt-det-h{margin:12px 0 4px;font-size:15px;color:#5d6b7a}
.dt-detail pre{background:#0f1720;color:#e6edf3;padding:12px;border-radius:8px;font:15px/1.6 Consolas,Menlo,monospace;white-space:pre;overflow-x:auto;margin:4px 0}
code{font:15px Consolas,Menlo,monospace;background:#eef2f7;padding:2px 6px;border-radius:5px}
.mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:6px}
.mb-card{background:#fff;border:1px solid #e1e7ef;border-top:6px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.mb-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.mb-card.sel{outline:3px solid var(--c)}
.mb-name{font:bold 15px Consolas,Menlo,monospace;color:var(--c);word-break:break-all}
.mb-val{font-size:12px;color:#5d6b7a;margin-top:2px}
.mb-mean{font-size:14px;margin-top:4px}
.hint{color:#5d6b7a;font-size:13px;text-align:center;margin-top:16px}
.pre-wrap{position:relative;margin:4px 0}
.dt-detail pre{user-select:text;-webkit-user-select:text;cursor:text;padding-right:100px!important;margin:0}
.cp-btn{position:absolute;top:8px;right:8px;font:bold 13px Arial,sans-serif;padding:5px 12px;border-radius:8px;border:1px solid #58a6ff;background:#1f6feb;color:#fff;cursor:pointer}
.cp-btn:hover{background:#1158c7}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1a7f37;color:#fff;padding:10px 18px;border-radius:20px;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<main>
<h1>VBA 単語集</h1>
<div class="box">
  <input id="q" placeholder="単語を検索(例:For、Cells、Split)">
  <div id="cats"></div>
  <div id="subcats" class="subcats" style="display:none"></div>
  <div class="count" id="count"></div>
</div>
<div id="dtwrap"></div>
<div id="list"></div>
<p class="hint">カードを押すと、その下に解説とサンプルが開きます。もう一度押すと閉じます。サンプルコードは、押すとコピーされます。</p>
<div id="toast"></div>
</main>
<script>
var E=[["手続き・関数|基本", "Sub", "値を返さない手続き(マクロ)を作る。", "Sub 名前()\n    ...\nEnd Sub", "マクロの入れ物です。Sub で始めたら End Sub で必ず閉じます。ボタンに登録するのもこの Sub です。", "Sub 挨拶()\n    Range(\"A1\").Value = \"こんにちは\"\nEnd Sub"], ["手続き・関数|基本", "Function", "値を返す手続きを作る。", "Function 名前(引数) As 型\n    名前 = 値\nEnd Function", "計算結果を呼び出し元に返します。結果は、関数名に値を代入して返します。セルの数式のように使うこともできます。", "Function Tax(price As Double) As Double\n    Tax = price * 1.1\nEnd Function\n\nSub 試す()\n    Range(\"B1\").Value = Tax(100)\nEnd Sub"], ["手続き・関数|基本", "Call", "別の Sub を呼び出す。", "Call 名前\n名前   (Call は省略できる)", "別の手続きを実行します。Call を付けるときは、名前の後ろに ( ) を付けない形にします。", "Sub 本体()\n    Call 準備\n    準備\nEnd Sub\n\nSub 準備()\n    Range(\"A1\").Value = 1\nEnd Sub"], ["手続き・関数|基本", "Exit Sub / Exit Function", "手続きの途中で抜ける。", "If 条件 Then Exit Sub", "条件に合ったら、そこで手続きを終わらせます。空データのチェックなどに使います。", "Sub 入力チェック()\n    If Range(\"A1\").Value = \"\" Then Exit Sub\n    Range(\"B1\").Value = \"入力あり\"\nEnd Sub"], ["変数・型|基本", "Option Explicit", "変数の宣言を必須にする。", "Option Explicit(モジュールの先頭に書く)", "宣言していない変数の打ち間違いを、実行前に見つけられます。書いておくと安全です。", "Option Explicit\n\nSub 例()\n    Dim n As Long\n    n = 5\nEnd Sub"], ["変数・型|基本", "Const", "変わらない値に名前を付ける。", "Const 名前 As 型 = 値", "税率などを一か所で管理できます。途中で書き換えるとエラーになります。", "Const TAX As Double = 0.1\n\nSub 例()\n    Range(\"B1\").Value = 100 * (1 + TAX)\nEnd Sub"], ["変数・型|基本|データ型", "Dim", "変数を宣言する。", "Dim 変数名 As 型", "使う変数を先に宣言します。As 型を省くと Variant になります。", "Sub 例()\n    Dim i As Long, s As String\n    i = 1\n    s = \"A\"\nEnd Sub"], ["変数・型|基本|データ型", "Long / Integer", "整数を入れる型。", "Dim n As Long", "Long は大きい整数(約21億まで)に使います。行番号や件数は Long にするのが基本です。", "Sub 例()\n    Dim row As Long\n    row = Cells(Rows.Count, 1).End(xlUp).Row\nEnd Sub"], ["変数・型|基本|データ型", "Double", "小数を入れる型。", "Dim x As Double", "小数や割り算の結果を入れるときに使います。", "Sub 例()\n    Dim avg As Double\n    avg = 10 / 4\n    Range(\"A1\").Value = avg\nEnd Sub"], ["変数・型|基本|データ型", "String / Boolean / Date", "文字・真偽・日付を入れる型。", "Dim s As String / Dim f As Boolean / Dim d As Date", "型に合わない値を入れるとエラーになります。Boolean は True か False です。", "Sub 例()\n    Dim s As String, f As Boolean, d As Date\n    s = \"abc\"\n    f = True\n    d = DateSerial(2024, 3, 1)\nEnd Sub"], ["変数・型|基本|データ型", "Set", "オブジェクト(シートなど)を変数に入れる。", "Set 変数 = オブジェクト", "シートや辞書などは、= ではなく Set で代入します。", "Sub 例()\n    Dim ws As Worksheet\n    Set ws = Worksheets(\"データ\")\n    ws.Range(\"A1\").Value = 1\nEnd Sub"], ["繰り返し", "For ～ Next", "決まった回数だけ繰り返す。", "For i = 開始 To 終了 Step 増分\n    ...\nNext i", "i が開始から終了まで増えながら、同じ処理を繰り返します。Step を省くと1ずつ増えます。", "Sub 例()\n    Dim i As Long\n    For i = 2 To 6\n        Cells(i, 1).Value = i * 10\n    Next i\nEnd Sub"], ["繰り返し", "For Each ～ Next", "範囲や配列の要素を1つずつ取り出す。", "For Each 要素 In 範囲\n    ...\nNext 要素", "件数を気にせず、すべての要素に同じ処理ができます。", "Sub 例()\n    Dim c As Range\n    For Each c In Range(\"A2:A5\")\n        c.Value = c.Value * 2\n    Next c\nEnd Sub"], ["繰り返し", "Do While ～ Loop", "条件が成り立つ間、繰り返す。", "Do While 条件\n    ...\nLoop", "回数が決まっていないときに使います。条件は先頭で判定します。", "Sub 例()\n    Dim n As Long\n    n = 1\n    Do While n <= 5\n        n = n + 1\n    Loop\nEnd Sub"], ["繰り返し", "Do Until ～ Loop", "条件が成り立つまで繰り返す。", "Do Until 条件\n    ...\nLoop", "Do While の反対です。「〜になるまで」と読みます。", "Sub 例()\n    Dim s As Long, i As Long\n    i = 2\n    Do Until s >= 100\n        s = s + Cells(i, 1).Value\n        i = i + 1\n    Loop\nEnd Sub"], ["繰り返し", "Do ～ Loop Until", "処理を1回実行してから、条件を判定する。", "Do\n    ...\nLoop Until 条件", "必ず1回は実行されます。条件を先頭で確かめる Do Until との違いに注意します。", "Sub 例()\n    Dim n As Long\n    n = 10\n    Do\n        n = n + 1\n    Loop Until n >= 5\n    Range(\"A1\").Value = n\nEnd Sub"], ["繰り返し", "Exit For", "For の途中で抜ける。", "If 条件 Then Exit For", "見つかったら、それ以上は調べないときに使います。", "Sub 例()\n    Dim i As Long\n    For i = 2 To 21\n        If Cells(i, 1).Value > 50 Then Exit For\n    Next i\n    Range(\"B1\").Value = i\nEnd Sub"], ["条件", "If ～ Then ～ Else ～ End If", "条件によって処理を分ける。", "If 条件 Then\n    ...\nElseIf 条件 Then\n    ...\nElse\n    ...\nEnd If", "上から順に判定し、最初に成り立ったところだけが実行されます。", "Sub 例()\n    If Range(\"A1\").Value >= 80 Then\n        Range(\"B1\").Value = \"優\"\n    ElseIf Range(\"A1\").Value >= 60 Then\n        Range(\"B1\").Value = \"良\"\n    Else\n        Range(\"B1\").Value = \"可\"\n    End If\nEnd Sub"], ["条件", "Mod", "割り算のあまりを求める。", "数値 Mod 数値", "あまりが 0 なら偶数、というように判定に使います。", "Sub 例()\n    If Range(\"A1\").Value Mod 2 = 0 Then\n        Range(\"B1\").Value = \"偶数\"\n    End If\nEnd Sub"], ["条件", "Select Case", "値の種類ごとに処理を分ける。", "Select Case 値\n    Case 値1\n    Case Else\nEnd Select", "同じ値を何度も比べるときに、If より読みやすくなります。", "Sub 例()\n    Select Case Range(\"A1\").Value\n        Case \"A\"\n            Range(\"B1\").Value = 1\n        Case \"B\", \"C\"\n            Range(\"B1\").Value = 2\n        Case Else\n            Range(\"B1\").Value = 0\n    End Select\nEnd Sub"], ["繰り返し", "With ～ End With", "同じオブジェクトへの操作をまとめる。", "With オブジェクト\n    .プロパティ\nEnd With", ".Range などの先頭を省いて書けます。同じシートに何行も書くときに便利です。", "Sub 例()\n    With Worksheets(\"データ\")\n        .Range(\"A1\").Value = 1\n        .Range(\"A2\").Value = 2\n    End With\nEnd Sub"], ["セル・シート", "Cells(行, 列)", "行と列の番号でセルを指定する。", "Cells(2, 1).Value", "行と列を数字で指定します。繰り返しの中で行番号を変えるときに使います。", "Sub 例()\n    Cells(2, 1).Value = \"A\"\n    Cells(2, 2).Value = Cells(2, 1).Value\nEnd Sub"], ["セル・シート", "Range", "範囲を文字で指定する。", "Range(\"A1\")\nRange(\"A1:A10\")", "セル番地を文字で書きます。範囲をまとめて扱えます。", "Sub 例()\n    Range(\"A1:A3\").Value = 0\n    Range(\"B1\").Formula = \"=A1+1\"\nEnd Sub"], ["セル・シート", "Value / Formula", "セルの値、または数式を読み書きする。", "セル.Value = 値\nセル.Formula = \"=...\"", "Value は値、Formula は数式を入れます。数式は文字列で書き、先頭に = を付けます。", "Sub 例()\n    Range(\"A1\").Value = 10\n    Range(\"B1\").Formula = \"=A1*2\"\nEnd Sub"], ["セル・シート", "Rows.Count / End(xlUp)", "データの最後の行を見つける。", "Cells(Rows.Count, 1).End(xlUp).Row", "下から上へ進み、最初に値があるセルを見つけます。データが増えても動きます。", "Sub 例()\n    Dim r As Long\n    r = Cells(Rows.Count, 1).End(xlUp).Row\n    Range(\"B1\").Value = r\nEnd Sub"], ["セル・シート", "Sheets / Worksheets", "シートを名前で指定する。", "Sheets(\"データ\")\nWorksheets(\"データ\")", "シート名を文字で書きます。シート名のつづりに注意してください。", "Sub 例()\n    Sheets(\"出力\").Range(\"A1\").Value = Sheets(\"データ\").Range(\"A1\").Value\nEnd Sub"], ["セル・シート", "Find", "文字を探して、そのセルを返す。", "範囲.Find(\"文字\", LookAt:=xlWhole)", "見つからないと Nothing になります。見つかったセルの行番号は .Row で取れます。", "Sub 例()\n    Dim c As Range\n    Set c = Range(\"B2:B21\").Find(\"A\", LookAt:=xlWhole)\n    If Not c Is Nothing Then Range(\"D1\").Value = c.Row\nEnd Sub"], ["セル・シート", "Offset", "基準のセルから、行や列を相対的に移動する。", "セル.Offset(行数, 列数)", "基準から何行・何列ずれたセルかを指定します。", "Sub 例()\n    Range(\"A1\").Offset(0, 1).Value = \"右隣\"\nEnd Sub"], ["計算(シート関数)", "WorksheetFunction", "ワークシート関数(SUM など)を VBA から使う。", "Application.WorksheetFunction.Sum(範囲)", "Excel の数式と同じ計算を、VBA の中で使えます。", "Sub 例()\n    Range(\"B1\").Value = Application.WorksheetFunction.Sum(Range(\"A2:A21\"))\nEnd Sub"], ["計算(シート関数)", "CountIf / SumIf", "条件に合う件数・合計を求める。", "WorksheetFunction.CountIf(範囲, 条件)\nWorksheetFunction.SumIf(範囲, 条件, 合計範囲)", "条件は \">=50\" や \"A\" のように文字で書きます。", "Sub 例()\n    Range(\"B1\").Value = Application.WorksheetFunction.CountIf(Range(\"A2:A21\"), \">=50\")\nEnd Sub"], ["計算(シート関数)", "Large / Match", "大きいほうから k 番目の値 / 値のある位置。", "WorksheetFunction.Large(範囲, k)\nWorksheetFunction.Match(値, 範囲, 0)", "Match は 0 を付けると完全一致になります。見つからないとエラーになるので、On Error で処理します。", "Sub 例()\n    Range(\"B1\").Value = Application.WorksheetFunction.Large(Range(\"A2:A21\"), 1)\nEnd Sub"], ["文字・日付", "& (連結)", "文字をつなげる。", "s = \"A\" & \"B\"", "数字とも連結できます。Cells の値を文字にして使うときによく使います。", "Sub 例()\n    Range(\"B1\").Value = \"No.\" & Range(\"A1\").Value\nEnd Sub"], ["文字・日付", "Left / Right / Mid", "文字の一部を取り出す。", "Left(文字, 文字数)\nMid(文字, 開始位置, 文字数)", "Left は左から、Right は右から、Mid は途中から取り出します。", "Sub 例()\n    Dim s As String\n    s = \"2024-03\"\n    Range(\"B1\").Value = Left(s, 4)\nEnd Sub"], ["文字・日付", "Trim / Len", "前後の空白を消す / 文字数を数える。", "Trim(文字)\nLen(文字)", "データに入った余計な空白を消すときに使います。", "Sub 例()\n    Range(\"B1\").Value = Trim(Range(\"A1\").Value)\n    Range(\"C1\").Value = Len(Trim(Range(\"A1\").Value))\nEnd Sub"], ["文字・日付", "Split", "文字を区切り文字で分けて配列にする。", "配列 = Split(文字, 区切り)", "CSV のような文字を、項目ごとに分けるときに使います。", "Sub 例()\n    Dim p As Variant, i As Long\n    p = Split(\"a,b,c\", \",\")\n    For i = 0 To UBound(p)\n        Cells(i + 2, 1).Value = p(i)\n    Next i\nEnd Sub"], ["文字・日付", "Format / DateSerial", "値を指定の形にする / 日付を作る。", "Format(値, \"yyyy-mm\")\nDateSerial(年, 月, 日)", "表示の形を整えたり、日付を組み立てたりします。DateSerial(2024, 4, 0) は、3月末日です。", "Sub 例()\n    Range(\"B1\").Value = Format(DateSerial(2024, 3, 15), \"yyyy-mm\")\n    Range(\"B2\").Value = Day(DateSerial(2024, 4, 0))\nEnd Sub"], ["配列・辞書", "Array / UBound / LBound", "配列を作る / 配列の最後・最初の番号を得る。", "配列 = Array(値1, 値2)\nUBound(配列)\nLBound(配列)", "配列の番号は通常 0 から始まります。For で UBound まで回すと、全部を順に扱えます。", "Sub 例()\n    Dim c As Variant, i As Long\n    c = Array(\"A\", \"B\", \"C\")\n    For i = LBound(c) To UBound(c)\n        Cells(i + 2, 1).Value = c(i)\n    Next i\nEnd Sub"], ["配列・辞書", "Scripting.Dictionary", "キーと値の組を扱う辞書を作る。", "Set d = CreateObject(\"Scripting.Dictionary\")", "キーで値を出し入れできます。d.Exists(キー) で登録済みかを調べられます。", "Sub 例()\n    Dim d As Object\n    Set d = CreateObject(\"Scripting.Dictionary\")\n    If Not d.Exists(\"A\") Then d.Add \"A\", 0\n    d(\"A\") = d(\"A\") + 1\n    Range(\"B1\").Value = d(\"A\")\nEnd Sub"], ["エラー処理", "On Error Resume Next", "エラーが出ても、次の行に進む。", "On Error Resume Next", "エラーを無視して進みます。使うと、後で Err.Number で確認する必要があります。", "Sub 例()\n    On Error Resume Next\n    Range(\"A1\").Value = 1 / 0\n    If Err.Number <> 0 Then Range(\"B1\").Value = \"エラー\"\nEnd Sub"], ["エラー処理", "On Error GoTo", "エラーが出たら、指定の場所に飛ぶ。", "On Error GoTo 行名", "エラー時の処理を、まとめて書けます。Exit Sub の後に、行名と処理を書きます。", "Sub 例()\n    On Error GoTo EH\n    Range(\"A1\").Value = 1 / 0\n    Exit Sub\nEH:\n    MsgBox \"エラー: \" & Err.Description\nEnd Sub"], ["エラー処理", "Err.Number / Err.Description", "エラーの番号と説明を取る。", "Err.Number\nErr.Description", "エラーの種類を判定したり、メッセージを表示したりできます。", "Sub 例()\n    On Error Resume Next\n    Range(\"A1\").Value = 1 / 0\n    If Err.Number <> 0 Then MsgBox Err.Description\nEnd Sub"], ["その他|基本", "MsgBox", "メッセージを表示する。", "MsgBox \"文\"", "確認や結果の表示に使います。ボタンを選ぶ形もあります。", "Sub 例()\n    MsgBox \"完了しました\", vbInformation\nEnd Sub"], ["データ型|変数・型", "Integer", "小さめの整数を入れる型(-32,768〜32,767)。", "Dim 変数 As Integer", "範囲が狭いので、大きな数は Long を使います。古いコードでよく見かけます。", "Sub 例()\n    Dim n As Integer\n    n = 300\n    Range(\"A1\").Value = n\nEnd Sub"], ["データ型|変数・型", "Byte", "0〜255 の整数を入れる型。", "Dim 変数 As Byte", "使える範囲が狭い代わりに、メモリを少しだけ節約できます。", "Sub 例()\n    Dim b As Byte\n    b = 255\n    Range(\"A1\").Value = b\nEnd Sub"], ["データ型|変数・型", "Single", "精度がやや低い小数を入れる型。", "Dim 変数 As Single", "小数ですが、細かい桁は正確でないことがあります。普通の計算は Double を使います。", "Sub 例()\n    Dim x As Single\n    x = 1.5\n    Range(\"A1\").Value = x\nEnd Sub"], ["データ型|変数・型", "Currency", "金額向けの小数(小数点以下4桁まで、誤差が出にくい)。", "Dim 変数 As Currency", "お金の計算で、小数の誤差を減らしたいときに使います。", "Sub 例()\n    Dim price As Currency\n    price = 1234.5678\n    Range(\"A1\").Value = price\nEnd Sub"], ["データ型|変数・型", "Date", "日付と時刻を入れる型。", "Dim 変数 As Date", "DateSerial で作った日付や、Now(現在日時)を入れられます。", "Sub 例()\n    Dim d As Date\n    d = DateSerial(2024, 3, 15)\n    Range(\"A1\").Value = Format(d, \"yyyy/mm/dd\")\nEnd Sub"], ["データ型|変数・型", "Variant", "どんな型の値でも入る型。", "Dim 変数 As Variant(または As を省略)", "型を決めないので便利ですが、間違った値が入ってもエラーになりにくいです。配列や Split の結果に使います。", "Sub 例()\n    Dim v As Variant\n    v = 10\n    v = \"テキスト\"\n    Range(\"A1\").Value = v\nEnd Sub"], ["データ型|変数・型", "Object", "オブジェクト(シートや辞書など)を入れる型。", "Dim 変数 As Object / Worksheet など", "Set で代入します。Worksheet、Range、Object などの型名があります。", "Sub 例()\n    Dim ws As Worksheet\n    Set ws = Worksheets(\"データ\")\n    Range(\"A1\").Value = ws.Name\nEnd Sub"], ["データ型|変数・型", "TypeName", "変数の型の名前を調べる。", "TypeName(変数)", "値の型が思った通りか確かめるときに使います。", "Sub 例()\n    Dim x As Double\n    x = 1.5\n    MsgBox TypeName(x)\nEnd Sub"], ["その他|基本", "MsgBox の種類", "ボタン・アイコン・戻り値の一覧(カードを押すと分類ごとに表示)", "MsgBox 文, 種類, タイトル", "種類は + でつなげて組み合わせます。カードを押すと、その種類のサンプルが開きます。", "Sub 例()\n  n\nEnd Sub"], ["基本|構文", "ByVal / ByRef", "引数を、値として渡すか、参照として渡すか。", "Sub 名前(ByVal 変数 As 型) / (ByRef 変数 As 型)", "ByRef は、呼び出し元の変数そのものを変えられます。既定は ByRef です。", "Sub 二倍(ByVal x As Long)\n    x = x * 2\nEnd Sub\n\nSub 試す()\n    Dim a As Long\n    a = 5\n    二倍 a\n    Range(\"A1\").Value = a\nEnd Sub"], ["基本|構文", "Optional 引数", "省略できる引数。", "Sub 名前(Optional 変数 As 型 = 既定値)", "省略したとき、既定値が使われます。IsMissing で省略を確かめることもできます。", "Function 税込(価格 As Double, Optional 率 As Double = 0.1) As Double\n    税込 = 価格 * (1 + 率)\nEnd Function"], ["基本|構文", "配列の宣言", "複数の値を、番号付きでまとめて入れる。", "Dim 配列(1 To 5) As Long", "番号の範囲を決めて宣言します。ReDim で後から大きさを変えられます。", "Sub 例()\n    Dim arr(1 To 3) As Long\n    arr(1) = 10\n    Range(\"A1\").Value = arr(1)\nEnd Sub"], ["基本|構文", "Option Base 1", "配列の番号を 1 から始める。", "Option Base 1(モジュールの先頭)", "省略すると 0 から始まります。Option Base は、モジュールの先頭にだけ書けます。", "Option Base 1\n\nSub 例()\n    Dim arr(3) As Long\n    arr(1) = 5\nEnd Sub"], ["基本|構文", "GoTo / ラベル", "指定した場所に飛ぶ。", "GoTo ラベル名 / ラベル名:", "エラー処理などで使います。多用すると読みにくくなるので、必要なときだけ使います。", "Sub 例()\n    If Range(\"A1\").Value = \"\" Then GoTo 終わり\n    Range(\"B1\").Value = \"OK\"\n終わり:\nEnd Sub"], ["基本|構文", "Exit Do", "Do ～ Loop の途中で抜ける。", "If 条件 Then Exit Do", "Exit For と同じように、条件に合ったら繰り返しを抜けます。", "Sub 例()\n    Dim i As Long\n    i = 1\n    Do\n        i = i + 1\n        If i >= 10 Then Exit Do\n    Loop\nEnd Sub"], ["基本|構文", "Nothing / Is Nothing", "オブジェクトが何も指していない状態。", "Set 変数 = Nothing / If 変数 Is Nothing Then", "Find が見つからなかったときなど、オブジェクトが無いかを調べるのに使います。", "Sub 例()\n    Dim c As Range\n    Set c = Range(\"A1:A10\").Find(\"X\")\n    If c Is Nothing Then Range(\"B1\").Value = \"なし\"\nEnd Sub"], ["基本|構文", "型変換(CLng・CDbl・CStr)", "値を別の型に変える。", "CLng(値) / CDbl(値) / CStr(値) / CDate(値)", "文字の数字を計算に使うときなどに変換します。変換できない値はエラーになります。", "Sub 例()\n    Dim s As String, n As Long\n    s = \"12\"\n    n = CLng(s) + 1\n    Range(\"A1\").Value = n\nEnd Sub"], ["基本|構文", "IsNumeric / IsDate / IsEmpty", "値の種類を調べる。", "IsNumeric(値) / IsDate(値) / IsEmpty(値)", "セルの  & _\n    \"Extended Properties=\"\"Excel 12.0 Xml;HDR=YES\"\";\"\n\n' DuckDB(ODBC ドライバーが必要)の場合\ns = \"Driver={DuckDB Driver};Database=C:\\data\\retail.duckdb;access_mode=READ_ONLY;\""], ["DB連携", "cn.Open / cn.Close", "接続を開く / 閉じる。", "cn.Open 接続文字列 / cn.Close", "使い終わったら必ず Close します。閉じ忘れると、次の接続でエラーになることがあります。", "Sub 例()\n    Dim cn As Object\n    Set cn = CreateObject(\"ADODB.Connection\")\n    cn.Open \"接続文字列\"\n    ' ここで処理する\n    cn.Close\n    Set cn = Nothing\nEnd Sub"], ["DB連携", "cn.Execute(SQL)", "SQL 文を実行して、結果(Recordset)を受け取る。", "Set rs = cn.Execute(\"SELECT …\")", "SELECT の結果は Recordset(レコードセット)で返ります。INSERT や UPDATE のように結果がない文は、戻り値を受け取らなくても実行できます。", "Sub 例()\n    Dim cn As Object, rs As Object\n    Set cn = CreateObject(\"ADODB.Connection\")\n    cn.Open \"接続文字列\"\n    Set rs = cn.Execute(\"SELECT transaction_date, daily_revenue FROM daily_retail_data\")\n    rs.Close\n    cn.Close\nEnd Sub"], ["DB連携", "Recordset(rs)", "SQL の結果を、1行ずつ読むための箱。", "rs.EOF / rs.MoveNext / rs.Fields(0).Value", "rs.EOF は「最後まで読んだか」です。MoveNext で次の行に進みます。Fields(番号) で列の値を取ります。", "Sub 例()\n    Dim cn As Object, rs As Object\n    Set cn = CreateObject(\"ADODB.Connection\")\n    cn.Open \"接続文字列\"\n    Set rs = cn.Execute(\"SELECT transaction_date, daily_revenue FROM daily_retail_data\")\n    Do Until rs.EOF\n        Debug.Print rs.Fields(0).Value, rs.Fields(1).Value\n        rs.MoveNext\n    Loop\n    rs.Close\n    cn.Close\nEnd Sub"], ["DB連携", "CopyFromRecordset", "結果を、そのままシートに貼り付ける。", "Range(\"A2\").CopyFromRecordset rs", "列名は貼られません。見出しは、先に自分で書いておきます。", "Sub 例()\n    Dim cn As Object, rs As Object\n    Set cn = CreateObject(\"ADODB.Connection\")\n    cn.Open \"接続文字列\"\n    Set rs = cn.Execute(\"SELECT business_category, SUM(daily_revenue) AS total FROM daily_retail_data GROUP BY business_category\")\n    Worksheets(\"結果\").Range(\"A2\").CopyFromRecordset rs\n    rs.Close\n    cn.Close\nEnd Sub"], ["DB連携", "SQL文を VBA で組み立てる", "SQL を文字でつなげて作る。", "sql = \"SELECT …\" & _ \"FROM …\"", "長い SQL は、行の継続(_)で分けて書きます。日付は Format で「yyyy-mm-dd」の形にします。", "Sub 例()\n    Dim sql As String, d As Date\n    d = DateSerial(2024, 1, 1)\n    sql = \"SELECT business_category, SUM(daily_revenue) AS total \" & _\n          \"FROM daily_retail_data \" & _\n          \"WHERE transaction_date >= '\" & Format(d, \"yyyy-mm-dd\") & \"' \" & _\n          \"GROUP BY business_category\"\n    Debug.Print sql\nEnd Sub"], ["DB連携", "Set cn = Nothing", "使い終わったオブジェクトを、解放する。", "Set cn = Nothing", "Close の後に書くと、接続や変数がきれいに片付きます。", "Sub 例()\n    Dim cn As Object\n    Set cn = CreateObject(\"ADODB.Connection\")\n    cn.Open \"接続文字列\"\n    cn.Close\n    Set cn = Nothing\nEnd Sub"], ["ファイル", "書き込み(Print #)", "テキストファイルに文字を書く。", "Open パス For Output As #番号 / Print #番号, 値 / Close #番号", "Output で開くと、既存の内容は消えて新しく書き込みます。FreeFile で空いている番号を取ります。", "Sub 例()\n    Dim f As Integer\n    f = FreeFile\n    Open \"C:\\data\\out.txt\" For Output As #f\n    Print #f, \"1行目\"\n    Print #f, \"2行目\"\n    Close #f\nEnd Sub"], ["ファイル", "読み取り(Line Input #)", "テキストファイルを1行ずつ読む。", "Open パス For Input As #番号 / Line Input #番号, 変数 / EOF(番号)", "EOF は「最後まで読んだか」です。Do Until EOF(f) で、最後の行まで繰り返します。", "Sub 例()\n    Dim f As Integer, s As String\n    f = FreeFile\n    Open \"C:\\data\\out.txt\" For Input As #f\n    Do Until EOF(f)\n        Line Input #f, s\n        Debug.Print s\n    Loop\n    Close #f\nEnd Sub"], ["ファイル", "追記(Append)", "既存のファイルの最後に、文字を足す。", "Open パス For Append As #番号", "内容を消さずに、末尾に書き足します。ログの記録などに使います。", "Sub 例()\n    Dim f As Integer\n    f = FreeFile\n    Open \"C:\\data\\log.txt\" For Append As #f\n    Print #f, Format(Now, \"yyyy/mm/dd hh:nn\") & \" 処理を実行\"\n    Close #f\nEnd Sub"], ["ファイル", "CSV を読み込んでシートへ", "CSV の1行を、カンマで分けてセルに書く。", "p = Split(行, \",\")", "Line Input で1行読み、Split で項目に分けます。シートの行番号を変数で数えます。", "Sub 例()\n    Dim f As Integer, s As String, p As Variant, r As Long\n    f = FreeFile\n    Open \"C:\\data\\sales.csv\" For Input As #f\n    r = 2\n    Do Until EOF(f)\n        Line Input #f, s\n        p = Split(s, \",\")\n        Cells(r, 1).Value = p(0)\n        Cells(r, 2).Value = p(1)\n        r = r + 1\n    Loop\n    Close #f\nEnd Sub"], ["ファイル", "Dir(ファイルを探す)", "フォルダの中のファイル名を、順に取り出す。", "Dir(パス) / Dir()", "最初は Dir(パス)、次からは Dir() で続きを取ります。見つからないと空文字になります。", "Sub 例()\n    Dim fn As String, r As Long\n    r = 2\n    fn = Dir(\"C:\\data\\*.csv\")\n    Do While fn <> \"\"\n        Cells(r, 1).Value = fn\n        r = r + 1\n        fn = Dir()\n    Loop\nEnd Sub"], ["ファイル", "ファイルの存在確認", "ファイルがあるかを調べる。", "If Dir(パス) <> \"\" Then / FSO.FileExists(パス)", "Dir で空文字なら、ファイルは無いです。書き込みの前に確かめると、上書きの事故を防げます。", "Sub 例()\n    If Dir(\"C:\\data\\out.txt\") <> \"\" Then\n        MsgBox \"ファイルがあります\"\n    Else\n        MsgBox \"ファイルがありません\"\n    End If\nEnd Sub"], ["ファイル", "FileSystemObject(FSO)", "ファイルやフォルダを扱うための道具。", "Set fso = CreateObject(\"Scripting.FileSystemObject\")", "FileExists、FolderExists、CreateTextFile などが使えます。Dir より細かく操作できます。", "Sub 例()\n    Dim fso As Object\n    Set fso = CreateObject(\"Scripting.FileSystemObject\")\n    If fso.FileExists(\"C:\\data\\out.txt\") Then Debug.Print \"あります\"\n    Set fso = Nothing\nEnd Sub"], ["ファイル", "Workbooks.Open / Close", "別の Excel ブックを開く / 閉じる。", "Set wb = Workbooks.Open(パス) / wb.Close SaveChanges:=False", "開いたブックは、使い終わったら閉じます。保存するかどうかを SaveChanges で指定します。", "Sub 例()\n    Dim wb As Workbook\n    Set wb = Workbooks.Open(\"C:\\data\\sales.xlsx\")\n    Debug.Print wb.Worksheets(1).Name\n    wb.Close SaveChanges:=False\nEnd Sub"], ["ファイル", "ファイルを選ぶダイアログ", "ユーザーにファイルを選んでもらう。", "Application.GetOpenFilename(\"説明,*.xlsx\")", "キャンセルすると False が返ります。選んだファイルのパスが文字で返ります。", "Sub 例()\n    Dim path As Variant\n    path = Application.GetOpenFilename(\"Excel ブック,*.xlsx\")\n    If path <> False Then Debug.Print path\nEnd Sub"], ["ファイル", "フォルダ作成・コピー・削除", "フォルダを作る、ファイルをコピー・削除する。", "MkDir パス / FileCopy 元, 先 / Kill パス / RmDir パス", "Kill は確認なしに削除します。実行前に、対象のパスを必ず確かめてください。", "Sub 例()\n    MkDir \"C:\\data\\backup\"\n    FileCopy \"C:\\data\\out.txt\", \"C:\\data\\backup\\out.txt\"\n    Kill \"C:\\data\\backup\\out.txt\"\n    RmDir \"C:\\data\\backup\"\nEnd Sub"], ["イベント", "Workbook_Open", "ブックを開いたときに自動で動く。", "Private Sub Workbook_Open()  ※ThisWorkbook に書く", "ThisWorkbook の中に書くと、ブックを開いたときに自動で実行されます。", "Private Sub Workbook_Open()\n    MsgBox \"ブックを開きました\", vbInformation\nEnd Sub"], ["イベント", "Worksheet_Change", "セルの値が変わったときに自動で動く。", "Private Sub Worksheet_Change(ByVal Target As Range)  ※シートのモジュールに書く", "Target は変わったセルです。Target.Address で、どのセルが変わったかを判定します。", "Private Sub Worksheet_Change(ByVal Target As Range)\n    If Target.Address = \"$A$1\" Then\n        Range(\"B1\").Value = Now\n    End If\nEnd Sub"], ["イベント", "Worksheet_SelectionChange", "選ぶセルが変わったときに自動で動く。", "Private Sub Worksheet_SelectionChange(ByVal Target As Range)", "選んだセルの行などを、画面に出すときなどに使います。", "Private Sub Worksheet_SelectionChange(ByVal Target As Range)\n    Range(\"D1\").Value = Target.Row\nEnd Sub"], ["イベント", "Workbook_BeforeClose", "ブックを閉じる前に動く。Cancel で閉じるのを止められる。", "Private Sub Workbook_BeforeClose(Cancel As Boolean)", "Cancel = True にすると、閉じる操作を止められます。保存の確認などに使います。", "Private Sub Workbook_BeforeClose(Cancel As Boolean)\n    If MsgBox(\"閉じますか？\", vbYesNo) = vbNo Then Cancel = True\nEnd Sub"], ["イベント", "Application.EnableEvents", "イベントの自動実行を止める。", "Application.EnableEvents = False", "セルに書き込むと、また Worksheet_Change が動いてしまうのを防ぎます。最後に True に戻します。", "Sub 例()\n    Application.EnableEvents = False\n    Range(\"A1\").Value = 10\n    Application.EnableEvents = True\nEnd Sub"], ["Excel操作", "Selection / ActiveCell", "今選んでいる範囲 / 今選んでいるセル。", "Selection / ActiveCell", "ユーザーが選んだ場所を扱うときに使います。Select は、ふつう避けて Range で直接指定します。", "Sub 例()\n    Range(\"A1:A3\").Select\n    Selection.Interior.Color = RGB(255, 255, 0)\n    MsgBox ActiveCell.Address\nEnd Sub"], ["Excel操作", "Rows / Columns(削除・挿入)", "行や列を削除・挿入する。", "Rows(3).Delete / Rows(2).Insert / Columns(\"B\").Delete", "行番号がずれるので、下の行から削除すると安全です。", "Sub 例()\n    Rows(3).Delete\n    Rows(2).Insert\n    Columns(\"B\").Delete\nEnd Sub"], ["Excel操作", "Sort(並べ替え)", "範囲を並べ替える。", "Range.Sort Key1:=Range(\"A1\"), Order1:=xlAscending, Header:=xlYes", "Header:=xlYes で、1行目を見出しとして扱います。xlDescending で大きい順になります。", "Sub 例()\n    Range(\"A1:C20\").Sort Key1:=Range(\"A1\"), Order1:=xlAscending, Header:=xlYes\nEnd Sub"], ["Excel操作", "AutoFilter(フィルター)", "条件で行を絞り込む。", "Range.AutoFilter Field:=列番号, Criteria1:=条件", "Field は範囲の左から何列目かです。解除は ActiveSheet.AutoFilterMode = False です。", "Sub 例()\n    Range(\"A1:C20\").AutoFilter Field:=2, Criteria1:=\"A\"\nEnd Sub"], ["Excel操作", "色・文字・表示形式", "セルの色、太字、数値の形式を変える。", "Interior.Color / Font.Bold / NumberFormat", "RGB(赤, 緑, 青) で色を指定します。NumberFormat で「#,##0」などの形式を指定します。", "Sub 例()\n    Range(\"A1\").Font.Bold = True\n    Range(\"A1\").Interior.Color = RGB(255, 255, 0)\n    Range(\"B2:B10\").NumberFormat = \"#,##0\"\nEnd Sub"], ["Excel操作", "シートの追加・削除", "シートを追加する / 削除する。", "Worksheets.Add / Worksheets(\"名前\").Delete", "削除の前に DisplayAlerts を False にすると、確認メッセージが出ません。", "Sub 例()\n    Dim ws As Worksheet\n    Set ws = Worksheets.Add(After:=Worksheets(Worksheets.Count))\n    ws.Name = \"結果\"\n    Application.DisplayAlerts = False\n    Worksheets(\"結果\").Delete\n    Application.DisplayAlerts = True\nEnd Sub"], ["Excel操作", "Copy / PasteSpecial", "コピーして、値だけ貼る。", "Range.Copy / Range.PasteSpecial Paste:=xlPasteValues", "数式ではなく値だけを貼れます。最後に CutCopyMode = False で点線を消します。", "Sub 例()\n    Range(\"A1:A5\").Copy\n    Range(\"C1\").PasteSpecial Paste:=xlPasteValues\n    Application.CutCopyMode = False\nEnd Sub"], ["Excel操作", "Replace(置換)", "範囲の中の文字を置き換える。", "Range.Replace What:=\"旧\", Replacement:=\"新\", LookAt:=xlPart", "LookAt:=xlPart は、一部が合えば置き換えます。xlWhole は、全体が一致したときだけです。", "Sub 例()\n    Range(\"A1:A100\").Replace What:=\"旧\", Replacement:=\"新\", LookAt:=xlPart\nEnd Sub"], ["Application", "Application.DisplayAlerts", "確認メッセージを出さない / 出す。", "Application.DisplayAlerts = False", "削除などの確認を止めます。使い終わったら必ず True に戻します。", "Sub 例()\n    Application.DisplayAlerts = False\n    ThisWorkbook.Worksheets(\"古い\").Delete\n    Application.DisplayAlerts = True\nEnd Sub"], ["Application", "Application.Calculation", "計算のタイミングを決める。", "Application.Calculation = xlCalculationManual / xlCalculationAutomatic", "大量の書き込みのときは手動にすると速くなります。最後に自動に戻します。", "Sub 例()\n    Application.Calculation = xlCalculationManual\n    ' 大量の書き込み\n    Application.Calculation = xlCalculationAutomatic\nEnd Sub"], ["Application", "Application.StatusBar", "画面の下(ステータスバー)に状況を出す。", "Application.StatusBar = \"文字\"", "長い処理のとき、進み具合を出せます。終わったら False で元に戻します。", "Sub 例()\n    Application.StatusBar = \"処理中です...\"\n    ' 処理\n    Application.StatusBar = False\nEnd Sub"], ["文字・数値", "InStr(文字の位置)", "文字の中に、別の文字があるかを調べる。", "InStr(文字, 探す文字)", "見つかった位置を返します。見つからないと 0 です。", "Sub 例()\n    Dim pos As Long\n    pos = InStr(Range(\"A1\").Value, \"@\")\n    Range(\"B1\").Value = pos\nEnd Sub"], ["文字・数値", "UCase / LCase", "大文字・小文字に変える。", "UCase(文字) / LCase(文字)", "英字の大文字・小文字をそろえて比べるときに使います。", "Sub 例()\n    Range(\"B1\").Value = UCase(Range(\"A1\").Value)\n    Range(\"C1\").Value = LCase(Range(\"A1\").Value)\nEnd Sub"], ["文字・数値", "Chr / Asc(文字コード)", "文字と、文字コード(番号)を変換する。", "Chr(番号) / Asc(文字)", "Asc(\"A\") は 65 です。Chr(65) は \"A\" です。", "Sub 例()\n    Debug.Print Asc(\"A\")\n    Debug.Print Chr(65)\nEnd Sub"], ["文字・数値", "Int / Fix(切り捨て)", "小数を整数にする。", "Int(数値) / Fix(数値)", "Int は負の数で、より小さい方へ。Fix は 0 の方へ切り捨てます。", "Sub 例()\n    Debug.Print Int(-2.5)\n    Debug.Print Fix(-2.5)\nEnd Sub"], ["文字・数値", "Abs / Sqr", "絶対値 / 平方根。", "Abs(数値) / Sqr(数値)", "Abs は符号を取ります。Sqr は平方根です。", "Sub 例()\n    Range(\"A1\").Value = Abs(-5)\n    Range(\"A2\").Value = Sqr(16)\nEnd Sub"], ["文字・数値", "Rnd / Randomize(乱数)", "ランダムな数を作る。", "Randomize / Rnd", "Rnd は 0 以上 1 未満の数です。Int(Rnd * 10) + 1 で 1～10 の整数になります。", "Sub 例()\n    Randomize\n    Range(\"A1\").Value = Int(Rnd * 10) + 1\nEnd Sub"], ["配列・コレクション", "ReDim / ReDim Preserve", "配列の大きさを、後から変える。", "ReDim 配列(1 To 数) / ReDim Preserve 配列(1 To 数)", "Preserve を付けると、中の値を残したまま大きさを変えられます。", "Sub 例()\n    Dim arr() As Long, i As Long\n    ReDim arr(1 To 3)\n    For i = 1 To 3\n        arr(i) = i\n    Next i\n    ReDim Preserve arr(1 To 5)\n    Range(\"A1\").Value = arr(3)\nEnd Sub"], ["配列・コレクション", "Erase", "配列の中身を消す。", "Erase 配列", "配列の値を初期化します。", "Sub 例()\n    Dim arr(1 To 3) As Long\n    arr(1) = 5\n    Erase arr\n    Range(\"A1\").Value = arr(1)\nEnd Sub"], ["配列・コレクション", "Collection", "順番に値を入れておくグループ。", "Dim col As New Collection / col.Add 値 / col.Item(番号)", "Add で追加し、Count で件数を数えます。配列と違い、大きさを気にせず追加できます。", "Sub 例()\n    Dim col As New Collection\n    col.Add \"東京\"\n    col.Add \"大阪\"\n    Debug.Print col.Count, col.Item(1)\nEnd Sub"], ["デバッグ", "Err.Raise(エラーを自分で出す)", "わざとエラーを発生させる。", "Err.Raise 番号, , \"説明\"", "条件に合わないときに、エラーとして知らせます。番号は vbObjectError + 数字 にします。", "Sub 例()\n    On Error GoTo EH\n    If Range(\"A1\").Value = \"\" Then Err.Raise vbObjectError + 1, , \"A1が空です\"\n    Exit Sub\nEH:\n    MsgBox Err.Description\nEnd Sub"], ["デバッグ", "Resume / Resume Next", "エラー処理の後に、どこから再開するかを決める。", "Resume(同じ行) / Resume Next(次の行)", "エラー処理の最後に書きます。Resume Next は、エラーの次の行へ進みます。", "Sub 例()\n    On Error GoTo EH\n    Range(\"A1\").Value = 1 / 0\n    Exit Sub\nEH:\n    MsgBox \"エラー番号: \" & Err.Number\n    Resume Next\nEnd Sub"], ["デバッグ", "F8 / F9(止めて確かめる)", "1行ずつ実行する / 止める場所を決める。", "F8: 1行ずつ実行 / F9: ブレークポイント", "F9 で止めたい行を選び、F5 で実行します。F8 で1行ずつ進み、変数の中身を確かめられます。", "Sub 例()\n    Dim i As Long\n    For i = 1 To 3\n        Debug.Print i\n    Next i\nEnd Sub"], ["デバッグ", "Debug.Assert", "条件が正しくないとき、実行を止める。", "Debug.Assert 条件", "テスト中に、前提が崩れていないかを確かめるのに使います。Stop と違い、本番では無視されます。", "Sub 例()\n    Debug.Assert Range(\"A1\").Value > 0\n    Range(\"B1\").Value = Range(\"A1\").Value * 2\nEnd Sub"], ["その他", "InputBox(入力欄)", "ユーザーに文字を入力してもらう。", "InputBox(\"説明\", \"タイトル\")", "キャンセルすると空文字になります。入力された値は文字で返ります。", "Sub 例()\n    Dim s As String\n    s = InputBox(\"名前を入力してください\", \"入力\")\n    If s <> \"\" Then Range(\"A1\").Value = s\nEnd Sub"], ["その他", "SaveAs(マクロ有効ブック)", "ブックを、マクロ有効の形式で保存する。", "ThisWorkbook.SaveAs Filename:=パス, Fi /* 押したカードの下に詳細を開く。同じカードをもう一度押すと閉じる(同じ並びの中だけで動く) */
/* サンプルの右端に「全コピー」ボタンを付ける。文字の一部は、ドラッグで選んでコピーできる */
function decoratePre(root){
  Array.prototype.forEach.call(root.querySelectorAll("pre"),function(p){
    if(p.parentNode.classList&&p.parentNode.classList.contains("pre-wrap"))return;
    var w=document.createElement("div");
    w.className="pre-wrap";
    p.parentNode.insertBefore(w,p);
    w.appendChild(p);
    var b=document.createElement("button");
    b.className="cp-btn";
    b.textContent="全コピー";
    w.appendChild(b);
  });
}
function toggleCard(card,html){
  var box=card.parentNode;
  var was=card.classList.contains("sel");
  Array.prototype.forEach.call(box.querySelectorAll(":scope > .dt-detail"),function(d){d.parentNode.removeChild(d)});
  Array.prototype.forEach.call(box.children,function(c){c.classList.remove("sel")});
  if(was)return;
  card.classList.add("sel");
  var kids=Array.prototype.filter.call(box.children,function(c){return c.classList.contains("gg-card")||c.classList.contains("dt-card")||c.classList.contains("mb-card")});
  var top=card.offsetTop,last=card;
  kids.forEach(function(x){if(x.offsetTop===top)last=x});
  var d=document.createElement("div");
  d.className="dt-detail";
  d.innerHTML=html;
  decoratePre(d);
  box.insertBefore(d,last.nextSibling);
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function toast(msg){
  var el=document.getElementById("toast");
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){el.classList.remove("show")},1400);
}
function copyText(s){
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=s;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand("copy")}catch(e){ok=false}
    document.body.removeChild(ta);
    toast(ok?"コピーしました":"コピーできませんでした");
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){toast("コピーしました")},fallback);
  }else fallback();
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(!t||!t.closest)return;
  var cb=t.closest(".cp-btn");
  if(cb){
    var pre=cb.parentNode.querySelector("pre");
    if(pre)copyText(pre.textContent);
    return;
  }
  var g=t.closest(".gg-card"),d=t.closest(".dt-card"),m=t.closest(".mb-card");
  if(g){toggleCard(g,ggHTML(GG_ROWS[+g.getAttribute("data-i")]));return}
  if(d){toggleCard(d,dtHTML(DT[+d.getAttribute("data-i")]));return}
  if(m){toggleCard(m,mbHTML(m.getAttribute("data-c")));return}
});

var fSel=null,tSel=null;
function drawCats(){
  var h='<button class="cat'+(fSel===null?' on':'')+'" data-f="">すべて</button>';
  h+=FOLDERS.map(function(f){return '<button class="cat'+(fSel===f.name?' on':'')+'" data-f="'+esc(f.name)+'">📁 '+esc(f.name)+'</button>'}).join("");
  $c.innerHTML=h;
  Array.prototype.forEach.call($c.querySelectorAll("button"),function(b){
    b.onclick=function(){
      var f=b.getAttribute("data-f");
      fSel=f?f:null;tSel=null;
      if(fSel!==null){
        var fo=FOLDERS.filter(function(x){return x.name===fSel})[0];
        if(fo.topics.length===1)tSel=fo.topics[0];
      }
      drawCats();draw();
    };
  });
  var sub=document.getElementById("subcats");
  if(fSel===null){sub.innerHTML="";sub.style.display="none";return}
  var topics=FOLDERS.filter(function(f){return f.name===fSel})[0].topics;
  if(topics.length===1){sub.innerHTML="";sub.style.display="none";return}
  sub.style.display="";
  sub.innerHTML='<button class="cat sub'+(tSel===null?' on':'')+'" data-t="">フォルダ全部</button>'+
    topics.map(function(t){return '<button class="cat sub'+(tSel===t?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>'}).join("");
  Array.prototype.forEach.call(sub.querySelectorAll("button"),function(b){
    b.onclick=function(){
      var t=b.getAttribute("data-t");
      tSel=t?t:null;
      drawCats();draw();
    };
  });
}
function draw(){
  var q=($q.value||"").toLowerCase().trim();
  var rows=E.filter(function(e){
    var tops=e[0].split("|");
    if(tSel!==null&&tops.indexOf(tSel)<0)return false;
    if(tSel===null&&fSel!==null){
      var inF=FOLDERS.filter(function(f){return f.name===fSel})[0].topics;
      if(!tops.some(function(x){return inF.indexOf(x)>=0}))return false;
    }
    if(tSel==="データ型"&&DT_HIDE.indexOf(e[1])>=0)return false;
    if(!q)return true;
    return (e[1]+" "+e[2]+" "+e[3]+" "+e[4]).toLowerCase().indexOf(q)>=0;
  });
  $n.textContent=rows.length+" 件";
  renderDT();
  GG_ROWS=rows;
  if(!rows.length){$l.innerHTML='<div class="box empty">見つかりません。別の言葉で検索してください。</div>';return}
  $l.innerHTML='<div class="gg-grid">'+rows.map(function(e,i){
    return '<div class="gg-card" data-i="'+i+'" style="--c:'+colorOf(e)+'"><div class="gg-name">'+esc(e[1])+'</div><div class="gg-mean">'+esc(e[2])+'</div><div class="gg-tag">'+esc(e[0].split("|").join(" ／ "))+'</div></div>';
  }).join("")+'</div>';
}
$q.oninput=draw;
drawCats();draw();

<div id="netbar" style="position:fixed;top:0;left:0;right:0;background:#57606a;color:#fff;font-size:14px;padding:6px 12px;text-align:center;z-index:99">オフラインで表示中</div>
<script>
/* ===== 接続の切り替え =====
   ONLINE_URL に、オンライン版のアドレスを入れてください。
   ・つながる → オンライン版を開く
   ・つながらない / 拒否された / 空欄 → この画面(オフライン版)をそのまま使う
*/
var ONLINE_URL = "";
function setNetBar(text,color){
  var b=document.getElementById("netbar");
  if(b){b.textContent=text;b.style.background=color||"#57606a"}
}
(function(){
  if(!ONLINE_URL){setNetBar("オフラインで表示中(オンライン版の場所が未設定です)");return}
  if(!navigator.onLine){setNetBar("オフラインで表示中");return}
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort()},4000);
  fetch(ONLINE_URL,{signal:ctrl.signal,cache:"no-store"})
    .then(function(r){clearTimeout(timer);if(r.ok){location.replace(ONLINE_URL)}else{setNetBar("オフラインで表示中")}})
    .catch(function(){clearTimeout(timer);setNetBar("オフラインで表示中")});
})();
</script>
